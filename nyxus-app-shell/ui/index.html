<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NYXUS</title>
<style>
  :root { --violet:#7d3dff; --magenta:#ff2dad; --green:#39ff14; --cyan:#2bd2ff; --void:#05060a; --ink:#eef2fa; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:var(--void); color:var(--ink);
    font-family:"Orbitron","DejaVu Sans",system-ui,sans-serif; overflow:hidden; }
  .wrap { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(125,61,255,.18), transparent 60%),
      radial-gradient(900px 500px at 90% 110%, rgba(255,45,173,.14), transparent 55%),
      var(--void); }
  .ring { width:88px; height:88px; border-radius:50%;
    border:3px solid rgba(125,61,255,.25); border-top-color:var(--magenta); border-right-color:var(--violet);
    animation:spin 1s linear infinite; filter:drop-shadow(0 0 10px rgba(255,45,173,.5)); }
  @keyframes spin { to { transform:rotate(360deg); } }
  .name { font-size:15px; letter-spacing:.42em; text-transform:uppercase; color:var(--cyan);
    text-shadow:0 0 12px rgba(43,210,255,.5); }
  .sub { font-size:12px; letter-spacing:.14em; color:rgba(238,242,250,.55); }
  .dots::after { content:""; animation:dots 1.4s steps(4,end) infinite; }
  @keyframes dots { 0%{content:"";} 25%{content:".";} 50%{content:"..";} 75%{content:"...";} }
</style>
</head>
<body>
  <div class="wrap">
    <div class="ring"></div>
    <div class="name" id="app-name">NYXUS</div>
    <div class="sub">starting service<span class="dots"></span></div>
  </div>
  <script>
    // The shell sets the title to the app name; mirror it into the splash.
    const t = document.title && document.title !== "NYXUS" ? document.title : null;
    if (t) document.getElementById("app-name").textContent = t;
  </script>
</body>
</html>
