[package]
name = "nyxus-app-shell"
version = "1.0.0"
description = "NYXUS native app shell — wraps a NYXUS web tool in a real desktop app window"
authors = ["Joseph A. Sierengowski"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nyxus_app_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
