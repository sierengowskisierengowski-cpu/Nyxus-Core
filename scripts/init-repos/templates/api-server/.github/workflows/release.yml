name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run build
      - run: tar -czf {{REPO_NAME}}-${{ github.ref_name }}.tgz dist package.json README.md
      - uses: softprops/action-gh-release@v2
        with:
          files: '{{REPO_NAME}}-${{ github.ref_name }}.tgz'
