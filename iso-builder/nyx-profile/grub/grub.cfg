set default="0"
set timeout=8

# Load the GRUB fonts + the NYXUS dragon theme. gfxterm is entered ONLY if a
# font actually loads — the old config switched to gfxterm with NO font, which
# rendered every glyph as a "?" box. If the fonts can't be found we stay in the
# plain text terminal (clean + readable), never the broken glyph render.
if loadfont "${prefix}/fonts/mono12.pf2" ; then
    loadfont "${prefix}/fonts/mono9.pf2"
    loadfont "${prefix}/fonts/mono10.pf2"
    loadfont "${prefix}/fonts/mono11.pf2"
    loadfont "${prefix}/fonts/bold14.pf2"
    loadfont "${prefix}/fonts/bold16.pf2"
    insmod all_video
    insmod gfxterm
    insmod png
    set gfxmode=auto
    terminal_output gfxterm
    set theme="${prefix}/themes/nyxus/theme.txt"
fi

menuentry "Boot NYXUS (NYX live)" --class nyxus --class arch {
    set gfxpayload=keep
    linux  /arch/boot/x86_64/vmlinuz-linux  archisobasedir=arch archisolabel=NYX_2026_05 quiet splash
    initrd /arch/boot/intel-ucode.img /arch/boot/amd-ucode.img /arch/boot/x86_64/initramfs-linux.img
}

menuentry "Boot NYXUS (safe / no KMS)" --class nyxus --class arch {
    set gfxpayload=keep
    linux  /arch/boot/x86_64/vmlinuz-linux  archisobasedir=arch archisolabel=NYX_2026_05 nomodeset
    initrd /arch/boot/intel-ucode.img /arch/boot/amd-ucode.img /arch/boot/x86_64/initramfs-linux.img
}

menuentry "UEFI Shell"             { chainloader /shellx64.efi }
menuentry "Reboot"                 { reboot }
menuentry "Power off"              { halt }
