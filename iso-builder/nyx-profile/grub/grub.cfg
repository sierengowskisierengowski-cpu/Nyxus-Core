# NYXUS — live boot menu · Kage Ryu dragon theme (rev 2026-08-01)
# © 2026 JOSEPH A. SIERENGOWSKI · NYX-J5W-2026-SIERENGOWSKI-LOCKED
# ============================================
#
# This file is the STOCK-KERNEL fallback menu. When NYX_WITH_KAGE_RYU=1 (the
# default) build-iso.sh overwrites it in the throwaway profile copy with the
# Kage-Ryu menu; keep the two in sync.

set default="0"
set timeout=8
set timeout_style=menu

# Colours for the plain-text terminal. These are what the user sees if the
# theme cannot be applied, and they used to be GRUB's stock white-on-blue.
set menu_color_normal=white/black
set menu_color_highlight=black/magenta

# Load the GRUB fonts + the NYXUS dragon theme. gfxterm is entered ONLY if a
# font actually loads — an earlier config switched to gfxterm with NO font,
# which rendered every glyph as a "?" box. If the fonts can't be found we stay
# in the plain text terminal (clean + readable), never the broken glyph render.
#
# The theme is only applied when its file is actually present. A `set theme=`
# pointing at a missing file leaves GRUB drawing a background with no menu
# widget on top of it, which is indistinguishable from a hung bootloader.
if loadfont "${prefix}/fonts/mono12.pf2" ; then
    loadfont "${prefix}/fonts/mono9.pf2"
    loadfont "${prefix}/fonts/mono10.pf2"
    loadfont "${prefix}/fonts/mono11.pf2"
    loadfont "${prefix}/fonts/bold14.pf2"
    loadfont "${prefix}/fonts/bold16.pf2"
    insmod all_video
    insmod gfxterm
    insmod png
    set gfxmode=auto
    terminal_output gfxterm
    if [ -f "${prefix}/themes/nyxus/theme.txt" ]; then
        set theme="${prefix}/themes/nyxus/theme.txt"
    fi
fi

# cow_spacesize — see B-06 / FS-01 in docs/ISO_FULL_AUDIT_2026-07-31.md.
# archiso defaults the live overlay tmpfs to 256M and the shipped image filled
# it within minutes of first login. Percentage scales with the machine and
# tmpfs allocates lazily, so nothing is reserved up front.

menuentry "Boot NYXUS (live)" --class nyxus --class arch {
    set gfxpayload=keep
    linux  /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux  archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=50% quiet splash
    initrd /%INSTALL_DIR%/boot/intel-ucode.img /%INSTALL_DIR%/boot/amd-ucode.img /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}

menuentry "Boot NYXUS (safe / no KMS)" --class nyxus --class arch {
    set gfxpayload=keep
    linux  /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux  archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=50% nomodeset
    initrd /%INSTALL_DIR%/boot/intel-ucode.img /%INSTALL_DIR%/boot/amd-ucode.img /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}

menuentry "Boot NYXUS (copy to RAM — unplug the stick after boot)" --class nyxus --class arch {
    set gfxpayload=keep
    linux  /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux  archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=50% copytoram quiet splash
    initrd /%INSTALL_DIR%/boot/intel-ucode.img /%INSTALL_DIR%/boot/amd-ucode.img /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}

menuentry "UEFI Shell"             { chainloader /shellx64.efi }
menuentry "UEFI Firmware Settings" { fwsetup }
menuentry "Reboot"                 { reboot }
menuentry "Power off"              { halt }
