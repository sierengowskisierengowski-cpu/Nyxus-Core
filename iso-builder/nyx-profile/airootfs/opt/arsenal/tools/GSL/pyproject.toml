[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.136.1",
    "psutil>=7.2.2",
    "python-multipart>=0.0.29",
    "uvicorn[standard]>=0.47.0",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["gsl-backend/tests"]
addopts = "-q"
