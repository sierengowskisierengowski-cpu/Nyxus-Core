openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: GowskiNet REDFORGE API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: disclaimer
  - name: dashboard
  - name: scenarios
  - name: missions
  - name: notes
  - name: notebooks
  - name: knowledge
  - name: scoreboard
  - name: settings
  - name: tutor
  - name: network

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /auth/status:
    get:
      operationId: getAuthStatus
      tags: [auth]
      summary: Setup status + current session
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }

  /auth/setup:
    post:
      operationId: setupAuth
      tags: [auth]
      summary: First-time admin setup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthSetupInput" }
      responses:
        "200":
          description: TOTP secret to enroll
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSetupResult" }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with password + TOTP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      responses:
        "204": { description: Logged out }

  /disclaimer/status:
    get:
      operationId: getDisclaimerStatus
      tags: [disclaimer]
      summary: Has disclaimer been accepted?
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisclaimerStatus" }

  /disclaimer/accept:
    post:
      operationId: acceptDisclaimer
      tags: [disclaimer]
      summary: Record disclaimer acceptance
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisclaimerStatus" }

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Mission Control summary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }

  /dashboard/recent-missions:
    get:
      operationId: getRecentMissions
      tags: [dashboard]
      summary: Recent completed missions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MissionSummary" }

  /dashboard/recent-notes:
    get:
      operationId: getRecentNotes
      tags: [dashboard]
      summary: Recently edited notes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Note" }

  /scenarios:
    get:
      operationId: listScenarios
      tags: [scenarios]
      summary: Browse curated detection scenarios
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: difficulty, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Scenario" }

  /scenarios/{id}:
    get:
      operationId: getScenario
      tags: [scenarios]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScenarioDetail" }

  /scenarios/{id}/deploy:
    post:
      operationId: deployScenario
      tags: [scenarios]
      summary: Start a mission based on this scenario
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeployScenarioInput" }
      responses:
        "201":
          description: Mission started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mission" }

  /scenarios/random:
    post:
      operationId: deployRandomScenario
      tags: [scenarios]
      summary: Generate and deploy a random scenario mission
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RandomScenarioInput" }
      responses:
        "201":
          description: Mission started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mission" }

  /missions:
    get:
      operationId: listMissions
      tags: [missions]
      summary: All missions (active + completed)
      parameters:
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MissionSummary" }

  /missions/active:
    get:
      operationId: getActiveMission
      tags: [missions]
      summary: Current active mission if any
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveMissionResponse" }

  /missions/{id}:
    get:
      operationId: getMission
      tags: [missions]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissionDetail" }
    delete:
      operationId: deleteMission
      tags: [missions]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }

  /missions/{id}/investigation:
    patch:
      operationId: updateInvestigation
      tags: [missions]
      summary: Save notes/hypothesis/evidence to active mission
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvestigationUpdate" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mission" }

  /missions/{id}/submit:
    post:
      operationId: submitMission
      tags: [missions]
      summary: Submit findings and score
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitMissionInput" }
      responses:
        "200":
          description: Scored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissionDebrief" }

  /missions/{id}/giveup:
    post:
      operationId: giveUpMission
      tags: [missions]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Revealed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissionDebrief" }

  /missions/{id}/hint:
    post:
      operationId: requestHint
      tags: [missions]
      summary: Reveal one hint (costs points)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Hint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HintResponse" }

  /missions/{id}/debrief:
    get:
      operationId: getMissionDebrief
      tags: [missions]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissionDebrief" }

  /missions/{id}/master:
    post:
      operationId: markMastered
      tags: [missions]
      summary: Mark a saved mission as mastered
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissionSummary" }

  /notes:
    get:
      operationId: listNotes
      tags: [notes]
      parameters:
        - { name: notebookId, in: query, schema: { type: integer } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: noteType, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: archived, in: query, schema: { type: boolean } }
        - { name: pinned, in: query, schema: { type: boolean } }
        - { name: favorited, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Note" }
    post:
      operationId: createNote
      tags: [notes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }

  /notes/{id}:
    get:
      operationId: getNote
      tags: [notes]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
    patch:
      operationId: updateNote
      tags: [notes]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
    delete:
      operationId: deleteNote
      tags: [notes]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }

  /notes/{id}/pin:
    post:
      operationId: togglePinNote
      tags: [notes]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }

  /notes/{id}/favorite:
    post:
      operationId: toggleFavoriteNote
      tags: [notes]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }

  /notes/{id}/archive:
    post:
      operationId: toggleArchiveNote
      tags: [notes]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }

  /notes/{id}/versions:
    get:
      operationId: listNoteVersions
      tags: [notes]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NoteVersion" }

  /notes/{id}/restore/{versionId}:
    post:
      operationId: restoreNoteVersion
      tags: [notes]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: versionId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }

  /notes/{id}/duplicate:
    post:
      operationId: duplicateNote
      tags: [notes]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "201":
          description: Duplicated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }

  /note-templates:
    get:
      operationId: listNoteTemplates
      tags: [notes]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NoteTemplate" }

  /notebooks:
    get:
      operationId: listNotebooks
      tags: [notebooks]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notebook" }
    post:
      operationId: createNotebook
      tags: [notebooks]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotebookInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notebook" }

  /notebooks/{id}:
    patch:
      operationId: updateNotebook
      tags: [notebooks]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotebookUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notebook" }
    delete:
      operationId: deleteNotebook
      tags: [notebooks]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }

  /tags:
    get:
      operationId: listTags
      tags: [notes]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TagSummary" }

  /kb/mitre/tactics:
    get:
      operationId: listMitreTactics
      tags: [knowledge]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MitreTactic" }

  /kb/mitre/techniques:
    get:
      operationId: listMitreTechniques
      tags: [knowledge]
      parameters:
        - { name: tactic, in: query, schema: { type: string } }
        - { name: platform, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MitreTechnique" }

  /kb/mitre/techniques/{techniqueId}:
    get:
      operationId: getMitreTechnique
      tags: [knowledge]
      parameters:
        - { name: techniqueId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MitreTechniqueDetail" }

  /kb/lolbas:
    get:
      operationId: listLolbas
      tags: [knowledge]
      parameters:
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/KbEntry" }

  /kb/lolbas/{name}:
    get:
      operationId: getLolbasEntry
      tags: [knowledge]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KbEntryDetail" }

  /kb/gtfobins:
    get:
      operationId: listGtfobins
      tags: [knowledge]
      parameters:
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/KbEntry" }

  /kb/gtfobins/{name}:
    get:
      operationId: getGtfobinsEntry
      tags: [knowledge]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KbEntryDetail" }

  /kb/malware:
    get:
      operationId: listMalware
      tags: [knowledge]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/KbEntry" }

  /kb/malware/{name}:
    get:
      operationId: getMalwareEntry
      tags: [knowledge]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KbEntryDetail" }

  /kb/atomic-tests:
    get:
      operationId: listAtomicTests
      tags: [knowledge]
      parameters:
        - { name: technique, in: query, schema: { type: string } }
        - { name: platform, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AtomicTest" }

  /kb/atomic-tests/{id}:
    get:
      operationId: getAtomicTest
      tags: [knowledge]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtomicTestDetail" }

  /kb/cves:
    get:
      operationId: listCves
      tags: [knowledge]
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: year, in: query, schema: { type: integer } }
        - { name: severity, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CveEntry" }

  /kb/cves/{cveId}:
    get:
      operationId: getCve
      tags: [knowledge]
      parameters:
        - { name: cveId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CveDetail" }

  /scoreboard/me:
    get:
      operationId: getMyProgress
      tags: [scoreboard]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressSummary" }

  /scoreboard/skills:
    get:
      operationId: getSkillRadar
      tags: [scoreboard]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SkillScore" }

  /scoreboard/streak:
    get:
      operationId: getStreak
      tags: [scoreboard]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreakData" }

  /scoreboard/achievements:
    get:
      operationId: listAchievements
      tags: [scoreboard]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Achievement" }

  /scoreboard/weekly:
    get:
      operationId: getWeeklySummary
      tags: [scoreboard]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeeklySummary" }

  /network/devices:
    get:
      operationId: listNetworkDevices
      tags: [network]
      summary: Recently discovered devices on local subnet
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NetworkDevice" }

  /network/scan:
    post:
      operationId: scanNetwork
      tags: [network]
      summary: Run a real host-discovery scan (nmap/arp-scan) of the allow-listed lab subnet
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NetworkDevice" }

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
    patch:
      operationId: updateSettings
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }

  /settings/change-password:
    post:
      operationId: changePassword
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordInput" }
      responses:
        "204": { description: Changed }

  /tutor/explain:
    post:
      operationId: tutorExplain
      tags: [tutor]
      summary: Ask Claude to explain code/log/technique (SSE stream)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TutorRequest" }
      responses:
        "200":
          description: SSE stream of text deltas
          content:
            text/event-stream:
              schema: { type: string }

  /tutor/quiz:
    post:
      operationId: tutorQuiz
      tags: [tutor]
      summary: Generate study questions about a technique
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuizRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizResponse" }

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    AuthStatus:
      type: object
      required: [needsSetup, authenticated]
      properties:
        needsSetup: { type: boolean }
        authenticated: { type: boolean }
        username: { type: ["string", "null"] }
        disclaimerAcceptedAt: { type: ["string", "null"], format: date-time }

    AuthSetupInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 8 }

    AuthSetupResult:
      type: object
      required: [totpSecret, otpauthUrl]
      properties:
        totpSecret: { type: string }
        otpauthUrl: { type: string }
        recoveryCodes:
          type: array
          items: { type: string }

    LoginInput:
      type: object
      required: [username, password, totpCode]
      properties:
        username: { type: string }
        password: { type: string }
        totpCode: { type: string }

    SessionInfo:
      type: object
