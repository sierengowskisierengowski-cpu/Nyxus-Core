          type: string
        description:
          type: string
        severity:
          type: string
          enum: [INFO, LOW, MEDIUM, HIGH, CRITICAL]
        condition:
          type: string
          enum: [any_event, threshold, specific_ip, specific_country, payload_detected, successful_auth]
        threshold:
          type: integer
        thresholdWindow:
          type: integer
        honeypotType:
          type: string
        notifyDiscord:
          type: boolean
        notifySlack:
          type: boolean
        notifyTelegram:
          type: boolean
        notifyEmail:
          type: boolean
        enabled:
          type: boolean

    HpAlertHistory:
      type: object
      required: [id, ruleName, severity, triggeredAt, acknowledged]
      properties:
        id:
