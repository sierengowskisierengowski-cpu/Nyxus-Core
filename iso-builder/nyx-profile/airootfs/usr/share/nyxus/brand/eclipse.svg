<?xml version="1.0" encoding="UTF-8"?>
<!--
  NYXUS — The Eclipse  (primary brand mark, rev r15)
  ────────────────────────────────────────────────────────────
  Black orb + cream crescent rising from its lower-right edge.
  Two shapes, two colours, infinitely scalable.
  Use:    chrome (SDDM, hyprlock, bar, favicon, Plymouth still)
  Colour: orb #000 → #0a0a0e radial, crescent #f4ead5
  © 2026 JOSEPH SIERENGOWSKI · NYX-J5W-2026-SIERENGOWSKI-LOCKED
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="nyxus-orb" cx="42%" cy="38%" r="62%">
      <stop offset="0%"   stop-color="#15151c"/>
      <stop offset="55%"  stop-color="#08080c"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="nyxus-crescent-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f4ead5" stop-opacity="0.55"/>
      <stop offset="60%"  stop-color="#f4ead5" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#f4ead5" stop-opacity="0"/>
    </radialGradient>
    <mask id="nyxus-crescent">
      <!-- White = visible crescent shape; carved by the offset masking circle. -->
      <rect width="512" height="512" fill="black"/>
      <circle cx="256" cy="256" r="200" fill="white"/>
      <circle cx="312" cy="222" r="196" fill="black"/>
    </mask>
  </defs>

  <!-- Soft outer halo (subtle, premium). -->
  <circle cx="256" cy="256" r="248" fill="url(#nyxus-crescent-glow)" opacity="0.35"/>

  <!-- The orb. -->
  <circle cx="256" cy="256" r="200"
          fill="url(#nyxus-orb)"
          stroke="#1a1a22" stroke-width="1"/>

  <!-- The crescent. -->
  <circle cx="256" cy="256" r="200"
          fill="#f4ead5"
          mask="url(#nyxus-crescent)"/>

  <!-- Inner specular hairline (premium polish). -->
  <circle cx="256" cy="256" r="199"
          fill="none"
          stroke="#f4ead5"
          stroke-opacity="0.05"
          stroke-width="1"/>
</svg>
