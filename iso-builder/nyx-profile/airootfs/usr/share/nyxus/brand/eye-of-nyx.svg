<?xml version="1.0" encoding="UTF-8"?>
<!--
  NYXUS — The Eye of Nyx  (empty-state glyph, rev r15)
  Almond eye with vertical slit pupil. "Nothing here, but I'm watching."
  Use: empty inboxes, idle lock, no-results, "coming soon".
  © 2026 JOSEPH SIERENGOWSKI · NYX-J5W-2026-SIERENGOWSKI-LOCKED
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="eye-iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f4ead5" stop-opacity="0.95"/>
      <stop offset="60%"  stop-color="#bfa97a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3a3022" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- Almond eye outline. -->
  <path d="M 32 256
           Q 256 64  480 256
           Q 256 448 32 256 Z"
        fill="#06060a"
        stroke="#f4ead5"
        stroke-opacity="0.6"
        stroke-width="2"/>

  <!-- Iris. -->
  <circle cx="256" cy="256" r="120" fill="url(#eye-iris)"/>

  <!-- Vertical slit pupil. -->
  <ellipse cx="256" cy="256" rx="14" ry="96" fill="#000"/>

  <!-- Specular highlight. -->
  <ellipse cx="220" cy="210" rx="22" ry="12" fill="#f4ead5" opacity="0.45"/>
</svg>
