# NYXUS — NVIDIA DRM kernel modesetting
# Arch ships this file via the nvidia-utils package, but we set it
# explicitly here so it's correct from first boot regardless of package
# install order. modeset=1 is required for Wayland support.
#
# As of nvidia driver 570.86.16+, fbdev is auto-enabled when modeset=1.
# Per Hyprland wiki: https://wiki.hypr.land/Nvidia/

options nvidia_drm modeset=1

# Preserve VRAM across suspend/resume + hibernate. Without this, the dGPU's
# video memory is dropped on sleep and Wayland/CUDA clients corrupt or crash
# on resume — the usual "black screen / broken resume" on Optimus laptops.
# Pairs with nvidia-{suspend,resume,hibernate}.service (enabled in
# customize_airootfs.sh). rev 2026-07-14.
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp
