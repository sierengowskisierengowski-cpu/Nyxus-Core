# NYXUS — dark theming for every toolkit, for the processes Hyprland's own
# `env =` lines never reach.
#
# WHY THIS FILE EXISTS: it fixes the white-popup regression on auth dialogs
# spawned by NetworkManager, polkit and gnome-keyring. Those arrive by D-Bus
# activation or from a systemd user unit, NOT as children of Hyprland, so they
# never see hyprland.conf's `env =` block. This file is read by the systemd
# user manager and covers exactly that population.
#
# ⚠ IT MUST AGREE WITH hyprland.conf AND skel's gtk-*.0/settings.ini, AND IT
# DID NOT (DE study §1.2-I). It set GTK_THEME=Adwaita:dark, and GTK_THEME has
# the HIGHEST precedence in GTK — so plain Adwaita beat the adw-gtk3-dark that
# hyprland.conf line 182 and both skel settings.ini files ask for, wherever
# this variable reached. Two correct intentions, disagreeing. Three surfaces
# said adw-gtk3-dark, one said Adwaita:dark; the majority is also the one whose
# theme package (adw-gtk-theme) actually ships, so the env var was corrected to
# match rather than the other three. adw-gtk3-dark is a dark theme, so the
# white-popup fix this file exists for is preserved.
GTK_THEME=adw-gtk3-dark

# Qt: qt5ct/qt6ct, matching hyprland.conf line 188 and the qt5ct/ + qt6ct/
# config directories skel has always shipped (style=Fusion + the nyxus-prism
# ALIEN NEON palette). This previously read `adwaita-dark`, naming a platform
# theme from adwaita-qt5/adwaita-qt6 — packages that NO LONGER EXIST in the
# Arch repos, so every Qt app fell back to default Fusion, i.e. light grey,
# against an ALIEN NEON desktop. qt5ct and qt6ct are now in packages.x86_64;
# the qt6ct plugin registers both the `qt5ct` and `qt6ct` keys, so one value
# serves Qt5 and Qt6.
QT_QPA_PLATFORMTHEME=qt5ct

# QT_STYLE_OVERRIDE was `Adwaita-Dark` here. It is REMOVED, not corrected:
# that style also came from the departed adwaita-qt packages, and
# QT_STYLE_OVERRIDE outranks the `style=` key in qt5ct.conf/qt6ct.conf — so
# even once qt5ct/qt6ct are installed it would have overridden the shipped
# NYXUS Qt configuration with a style that is not on the image. Leaving it
# unset is what lets those configs apply.

ADW_DEBUG_COLOR_SCHEME=prefer-dark
