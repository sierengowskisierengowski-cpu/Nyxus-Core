#
# greetd is the sole display manager for NYXUS (live ISO + installed).
# rev 2026-07-09 r2 — themed regreet chain, all official repo packages.
#
# FOUR-LAYER FALLBACK so the system can NEVER be locked out:
#
#   1. default_session → /usr/local/bin/nyxus-greeter
#      A defensive wrapper that walks: regreet under cage (the themed
#      NYXUS login screen — /etc/greetd/regreet.toml + regreet.css),
#      then tuigreet (packaged TUI greeter, prism --theme), then
#      agreety (built into greetd), then launches Hyprland directly.
#      Greeters that crash at startup are demoted for the rest of the
#      boot, so greetd's respawn loop converges on a working layer.
#
#   2. initial_session → autologin `nyx` straight into Hyprland on
#      the first greetd start of every boot (live ISO safety net).
#      nyxus-postinstall STRIPS this block on installed systems so
#      real installs always prompt.
#
#   3. SDDM and all other display managers must NOT be active
#      alongside this. greetd is sole DM (customize_airootfs.sh
#      enables greetd.service; display-manager.service aliases it).

[terminal]
vt = 1

[default_session]
command = "/usr/local/bin/nyxus-greeter"
user = "greeter"

[initial_session]
command = "Hyprland"
user = "nyx"
