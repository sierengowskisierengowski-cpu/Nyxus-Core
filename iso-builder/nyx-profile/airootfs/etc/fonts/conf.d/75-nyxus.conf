<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  NYXUS · fontconfig defaults · rev 2026-05-14 r15-spec-locked
  Lock Inter as system sans, JetBrainsMono Nerd Font as mono,
  Caveat as cursive/handwriting. Every app — branded or not — picks
  these up automatically so the brand can't leak through font choice.
-->
<fontconfig>

  <!-- ── Default sans-serif (UI, body text everywhere) ──────────── -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Inter Variable</family>
      <family>Noto Sans</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <!-- ── Default monospace (terminals, code, JBM chrome) ────────── -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>JetBrains Mono</family>
      <family>Noto Sans Mono</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>

  <!-- ── Default serif (rare in NYXUS but required by spec) ─────── -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Serif</family>
      <family>DejaVu Serif</family>
    </prefer>
  </alias>

  <!-- ── Cursive (Caveat — used for sticky notes, signatures) ───── -->
  <alias>
    <family>cursive</family>
    <prefer>
      <family>Caveat</family>
      <family>Caveat Brush</family>
      <family>DejaVu Serif</family>
    </prefer>
  </alias>

  <!-- ── Common Windows/macOS font names → NYXUS equivalents ────── -->
  <!-- so cross-platform docs and web pages always render branded -->
  <alias binding="same"><family>Helvetica</family>      <accept><family>Inter</family></accept></alias>
  <alias binding="same"><family>Helvetica Neue</family> <accept><family>Inter</family></accept></alias>
  <alias binding="same"><family>Arial</family>          <accept><family>Inter</family></accept></alias>
  <alias binding="same"><family>San Francisco</family>  <accept><family>Inter</family></accept></alias>
  <alias binding="same"><family>SF Pro</family>         <accept><family>Inter</family></accept></alias>
  <alias binding="same"><family>SF Pro Display</family> <accept><family>Inter</family></accept></alias>
  <alias binding="same"><family>SF Pro Text</family>    <accept><family>Inter</family></accept></alias>
  <alias binding="same"><family>Segoe UI</family>       <accept><family>Inter</family></accept></alias>
  <alias binding="same"><family>Roboto</family>         <accept><family>Inter</family></accept></alias>

  <alias binding="same"><family>Menlo</family>          <accept><family>JetBrainsMono Nerd Font</family></accept></alias>
  <alias binding="same"><family>Monaco</family>         <accept><family>JetBrainsMono Nerd Font</family></accept></alias>
  <alias binding="same"><family>Consolas</family>       <accept><family>JetBrainsMono Nerd Font</family></accept></alias>
  <alias binding="same"><family>Courier New</family>    <accept><family>JetBrainsMono Nerd Font</family></accept></alias>
  <alias binding="same"><family>SF Mono</family>        <accept><family>JetBrainsMono Nerd Font</family></accept></alias>

  <!-- ── Font rendering — crisp, hinted, dark-bg friendly ───────── -->
  <match target="font">
    <edit name="antialias"  mode="assign"><bool>true</bool></edit>
    <edit name="hinting"    mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle"  mode="assign"><const>hintslight</const></edit>
    <edit name="rgba"       mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter"  mode="assign"><const>lcddefault</const></edit>
    <edit name="autohint"   mode="assign"><bool>false</bool></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>

</fontconfig>
