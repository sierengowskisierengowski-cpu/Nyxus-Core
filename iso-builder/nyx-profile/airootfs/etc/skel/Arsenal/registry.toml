# Arsenal tool registry — data-driven; the hub reads this at runtime.
# Add/edit a [[tool]] block and it shows up in the hub. No recompile needed.
#
# fields:
#   id          unique short id
#   name        display name
#   desc        one-line description
#   category    defense | offense | ai | infra
#   interface   service | webapp | web | cli
#   path        absolute path (optional for pure web URLs)
#   launch      shell command the hub runs on <Enter>
#   status      how the hub checks live state:
#               service_system=<unit> | service_user=<unit> | docker=<name> | web=<url> | none

[[tool]]
id = "jett"
name = "jeTT"
desc = "Local AI EDR — kernel/proc behavior watchdog (Rust + CUDA), learn/enforce"
category = "defense"
interface = "service"
path = "/usr/local/lib/jett"
launch = "kitty --title jeTT -e sh -c 'journalctl -u jett-daemon -f 2>&1 || { echo; echo \"(press enter)\"; read _; }'"
status = "service_system=jett-daemon"

[[tool]]
id = "bifrost"
name = "Bifrost"
desc = "AI-powered Linux EDR / guardian"
category = "defense"
interface = "service"
path = "/usr/lib/bifrost"
