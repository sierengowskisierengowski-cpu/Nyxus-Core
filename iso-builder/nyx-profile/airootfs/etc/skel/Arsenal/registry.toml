launch = "kitty --title Meli -e sh -c 'journalctl --user -u meli-ingest -f 2>&1 || { echo; echo \"(press enter)\"; read _; }'"
status = "service_user=meli-ingest"

[[tool]]
id = "honeypot"
name = "Honeypot Stack"
desc = "Cowrie/Heralding/Conpot/Dionaea/Endlessh + Grafana/Loki/Prometheus"
category = "defense"
interface = "service"
path = "/opt/honeypot"
launch = "kitty --title Honeypot -e sh -c 'cd /opt/honeypot && docker compose ps; echo; exec bash'"
status = "docker=cowrie"

