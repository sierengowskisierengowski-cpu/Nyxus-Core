{
  "_comment": "NYXUS · Orca screen-reader preset · rev 2026-05-13 r1. Loaded the first time Orca starts for a NYXUS user. Sane defaults: speech off until the user enables it from Settings → Accessibility, but braille + magnifier shortcuts are pre-mapped.",
  "general": {
    "presentToolTips": false,
    "sayAllStyle": 1,
    "verbalizePunctuationStyle": 1,
    "speechServerFactory": "speechdispatcherfactory",
    "speechServerInfo": ["default", "default"],
    "voices": {
      "default":   { "established": false, "family": { "locale": "en-US", "name": "default" }, "rate": 50, "average-pitch": 5, "gain": 9 },
      "uppercase": { "established": false, "average-pitch": 7 },
      "hyperlink": { "established": false, "average-pitch": 6 },
      "system":    { "established": false, "average-pitch": 4 }
    },
    "enableSpeech": false,
    "enableBraille": true,
    "enableMagnifier": false,
    "enableEchoByCharacter": false,
    "enableEchoByWord": false,
    "enableKeyEcho": false,
    "enableMouseReview": false,
    "skipBlankCells": true,
    "speechVerbosityLevel": 1
  },
  "profiles": {
    "default": {
      "_description": "NYXUS default — quiet until requested.",
      "general":    { "enableSpeech": false, "enableBraille": true, "enableMagnifier": false }
    },
    "low-vision": {
      "_description": "NYXUS low-vision — magnifier + speech on.",
      "general":    { "enableSpeech": true,  "enableBraille": true, "enableMagnifier": true }
    },
    "screen-reader": {
      "_description": "NYXUS screen-reader — full speech, braille, key echo.",
      "general":    { "enableSpeech": true,  "enableBraille": true, "enableMagnifier": false, "enableEchoByCharacter": true, "enableKeyEcho": true }
    }
  },
  "activeProfile": "default"
}
