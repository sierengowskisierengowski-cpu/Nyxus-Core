# ════════════════════════════════════════════════════════════════════
#  NYXUS · kitty · ALIEN NEON · rev 2026-07-23
#  Canonical palette: violet #7d3dff · magenta #ff2dad · green #39ff14 ·
#  orange #ff8a1e · cyan #2bd2ff · red #ff2d55 · yellow #ffe600
#  Default text is cool white #eef2fa on void — colors appear only where
#  programs actually emit ANSI color (no random rainbow output). Mirrors
#  alacritty.toml exactly — keep in lockstep.
#  © 2026 Joseph A. Sierengowski · NYX-J5W-2026-SIERENGOWSKI-LOCKED
# ════════════════════════════════════════════════════════════════════

# ── Font ─────────────────────────────────────────────────────────────
font_family      JetBrains Mono Nerd Font
bold_font        JetBrains Mono Nerd Font Bold
italic_font      JetBrains Mono Nerd Font Italic
bold_italic_font JetBrains Mono Nerd Font Bold Italic
font_size        11.5
modify_font      baseline 1

# ── Window · frosted void glass ──────────────────────────────────────
background_opacity        0.88
window_padding_width      12 16
hide_window_decorations   yes
confirm_os_window_close   0
remember_window_size      no
initial_window_width      1280
initial_window_height     800
linux_display_server      wayland
wayland_titlebar_color    background

# ── Cursor · electric violet block ───────────────────────────────────
cursor                    #7d3dff
cursor_text_color         #05060a
cursor_shape              block
cursor_blink_interval     0.5
cursor_stop_blinking_after 0

# ── Scrollback ───────────────────────────────────────────────────────
scrollback_lines          10000
wheel_scroll_multiplier   5.0

# ── Mouse / selection ────────────────────────────────────────────────
copy_on_select            clipboard
mouse_hide_wait           1.0
url_color                 #2bd2ff
url_style                 curly

# ── Bell · silent, no flash ──────────────────────────────────────────
enable_audio_bell         no
visual_bell_duration      0.0

# ── Tabs · void bar, violet active tab ───────────────────────────────
tab_bar_edge              bottom
tab_bar_style             powerline
tab_powerline_style       slanted
active_tab_foreground     #05060a
active_tab_background     #7d3dff
active_tab_font_style     bold
inactive_tab_foreground   #9aa0ad
inactive_tab_background   #0a0d14
tab_bar_background        #05060a

# ── ALIEN NEON palette (matches alacritty.toml) ──────────────────────
foreground                #eef2fa
background                #05060a
selection_foreground      #05060a
selection_background      #ff2dad

# black / void
color0  #05060a
color8  #3a4152
# red · neon red
color1  #ff2d55
color9  #ff5470
# green · neon green
color2  #39ff14
color10 #7dff5e
# yellow · neon yellow
color3  #ffe600
color11 #fff26b
# blue · electric blue
color4  #7d3dff
color12 #a97dff
# magenta · neon magenta
color5  #ff2dad
color13 #ff7ae5
# cyan · electric cyan
color6  #2bd2ff
color14 #66efff
# white · cool white
color7  #eef2fa
color15 #ffffff

# window borders (kitty splits)
active_border_color       #7d3dff
inactive_border_color     #3a4152
bell_border_color         #ff8a1e

# marks (neon on void)
mark1_foreground #05060a
mark1_background #ff2dad
mark2_foreground #05060a
mark2_background #7d3dff
mark3_foreground #05060a
mark3_background #ff8a1e

# ── Keybinds · match alacritty muscle memory ─────────────────────────
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+plus    change_font_size all +1.0
map ctrl+minus   change_font_size all -1.0
map ctrl+0       change_font_size all 0
