# ── Font ─────────────────────────────────────────────────────────────
font_family      JetBrains Mono Nerd Font
bold_font        JetBrains Mono Nerd Font Bold
italic_font      JetBrains Mono Nerd Font Italic
bold_italic_font JetBrains Mono Nerd Font Bold Italic
font_size        11.5
modify_font      baseline 1

# ── Window · frosted void glass ──────────────────────────────────────
background_opacity        0.88
window_padding_width      12 16
hide_window_decorations   yes
confirm_os_window_close   0
remember_window_size      no
initial_window_width      1280
initial_window_height     800
linux_display_server      wayland
wayland_titlebar_color    background

# ── Cursor · prism magenta block ─────────────────────────────────────
cursor                    #794dff
cursor_text_color         #05060a
cursor_shape              block
cursor_blink_interval     0.5
cursor_stop_blinking_after 0

# ── Scrollback ───────────────────────────────────────────────────────
scrollback_lines          10000
wheel_scroll_multiplier   5.0

# ── Mouse / selection ────────────────────────────────────────────────
copy_on_select            clipboard
mouse_hide_wait           1.0
url_color                 #ff266c
url_style                 curly

# ── Bell · silent, visual prism flash ────────────────────────────────
enable_audio_bell         no
visual_bell_duration      0.0
bell_border_color         #794dff

# ── Tabs · void bar with prism active tab ────────────────────────────
tab_bar_edge              bottom
tab_bar_style             powerline
tab_powerline_style       slanted
active_tab_foreground     #05060a
active_tab_background     #794dff
active_tab_font_style     bold
inactive_tab_foreground   #9aa0ad
inactive_tab_background   #0a0a14
tab_bar_background        #05060a

# ── PRISM palette (matches alacritty.toml) ───────────────────────────
foreground                #eef2fa
background                #05060a
selection_foreground      #05060a
selection_background      #ff266c

# black
color0  #05060a
color8  #3a4152
# red
color1  #ff5470
color9  #ff7a93
# green
color2  #26ffb7
color10 #6dffcf
# yellow
color3  #ffb026
color11 #ffce85
# blue
color4  #4d9fff
color12 #7ab8ff
# magenta
color5  #794dff
color13 #ff7ae5
# cyan
color6  #ff266c
color14 #66efff
# white
color7  #eef2fa
color15 #ffffff

# window borders (kitty splits)
active_border_color       #794dff
inactive_border_color     #3a4152
bell_border_color         #ffb026

# marks
mark1_foreground #05060a
mark1_background #ff266c
mark2_foreground #05060a
mark2_background #794dff
mark3_foreground #05060a
mark3_background #ffb026

# ── Keybinds · match alacritty muscle memory ─────────────────────────
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+plus    change_font_size all +1.0
map ctrl+minus   change_font_size all -1.0
map ctrl+0       change_font_size all 0
