# ============================================================
#  NYXUS — Hyprlock · FROSTED GLASS
#  ~/.config/hypr/hyprlock.conf
#
#  rev 2026-07-31 — "almost-transparent frosted glass" redesign.
#  The solid clock card and the ◤X◥ glyph are gone. Everything is
#  glowing lettering floating on a heavily-blurred urban-alien wall,
#  layered for depth: the clock + live audio spectrum sit FORWARD
#  (bright, big glow), the corner chrome sits BACK (dim, small, soft).
#  Two low-alpha frosted panes give the glass its body without a card.
#
#  ★ THE ONE-OF-A-KIND PIECE: a live audio spectrum (nyxus-lock-cava)
#  that dances to whatever is playing and settles to a calm glow line
#  when quiet — doubled, accent over a magenta offset, for a chromatic
#  frosted-glass shimmer. Fails to nothing if audio is off; never
#  breaks the lock.
#
#  Accent rides hyprlock-accent.conf (nyxus-apply-accent §3).
#  © 2026 JOSEPH A. SIERENGOWSKI · NYX-J5W-2026-SIERENGOWSKI-LOCKED
# ============================================================

general {
    hide_cursor        = true
    ignore_empty_input = false
    text_trim          = true
    immediate_render   = true
}

# ── ANIMATIONS · cinematic frosted entrance ─────────────────
animations {
    enabled = true
    bezier = nyx-glass,  0.16, 1.0,  0.2,  1.0
    bezier = nyx-spring, 0.34, 1.36, 0.64, 1.0
    bezier = nyx-out,    0.4,  0.0,  1.0,  1.0
    animation = fadeIn,           1, 8,  nyx-glass
    animation = fadeOut,          1, 4,  nyx-out
    animation = inputFieldColors, 1, 5,  nyx-glass
    animation = inputFieldFade,   1, 6,  nyx-glass
    animation = inputFieldWidth,  1, 6,  nyx-spring
    animation = inputFieldDots,   1, 4,  nyx-spring
}

source = ~/.config/hypr/hyprlock-accent.conf

# ── BACKGROUND · deep frosted blur ──────────────────────────
# Heavy blur turns the urban-alien wall into a frosted pane the
# lettering floats over. Falls back to flat ink if the art is missing.
background {
    monitor           =
    color             = rgb(05010D)
    path              = /usr/share/backgrounds/nyxus/nyxus-urban-alien.png
    # Dark frosted glass, NOT a light wash. The first pass over-blurred with
    # high vibrancy and the bright galaxy tones washed the whole wall pale
    # blue, drowning the glass panes and the glowing text. Heavier darkening
    # + low vibrancy keeps it a deep, moody frost the prism lettering pops off.
    blur_size         = 5
    blur_passes       = 3
    brightness        = -0.34
    contrast          = 1.12
    vibrancy          = 0.12
    vibrancy_darkness = 0.40
}

# ══ FROSTED GLASS PANES (depth — drawn first, sit BACK) ══════
# Almost-transparent: the blurred wall reads straight through. A big
# soft pane set furthest back, a tighter brighter pane nearer the
# content. No hard card edge — just glass catching the light.
shape {
    monitor      =
    size         = 1180, 720
    color        = rgba(10, 8, 20, 0.14)
    rounding     = 34
    border_size  = 0
    shadow_passes = 4
    shadow_size   = 40
    shadow_color  = rgba(0, 0, 0, 0.45)
    position     = 0, 0
    halign       = center
    valign       = center
}
shape {
    monitor      =
    size         = 720, 430
    color        = rgba(18, 13, 32, 0.22)
    rounding     = 26
    border_size  = 1
    border_color = $nyxus_accent_faint
    shadow_passes = 3
    shadow_size   = 22
    shadow_color  = $nyxus_accent_glow
    shadow_boost  = 0.9
    position     = 0, 40
    halign       = center
    valign       = center
}

# ══ FORWARD LAYER · the hero content ════════════════════════

# GREETING (script flourish)
label {
    monitor     =
    text        = welcome back, <span foreground='##eef2fa'>$USER</span>
    color       = $nyxus_accent_rgba
    font_size   = 40
    font_family = Caveat
    shadow_passes = 3
    shadow_size   = 14
    shadow_color  = $nyxus_accent_glow
    shadow_boost  = 1.5
    position = 0, 300
    halign   = center
    valign   = center
}

# CLOCK — the forward hero (chunky Orbitron, big prism glow)
label {
    monitor     =
    text        = $TIME
    color       = $nyxus_accent_rgba
    font_size   = 132
    font_family = Orbitron ExtraBold
    shadow_passes = 4
    shadow_size   = 30
    shadow_color  = $nyxus_accent_glow
    shadow_boost  = 2.0
    position = 0, 170
    halign   = center
    valign   = center
}

# WEEKDAY · DATE (one calm line under the clock)
label {
    monitor     =
    text        = cmd[update:60000] echo "$(date +%A) · $(date '+%B %d' | tr '[:lower:]' '[:upper:]' | sed 's/./& /g')"
    color       = rgba(230, 236, 250, 0.90)
    font_size   = 18
    font_family = Caveat
    shadow_passes = 2
    shadow_size   = 8
    shadow_color  = rgba(0, 0, 0, 0.7)
    position = 0, 78
    halign   = center
    valign   = center
}

# ★ LIVE AUDIO SPECTRUM — magenta ghost (drawn first, sits behind,
#   offset for a chromatic shimmer)
label {
    monitor     =
    text        = cmd[update:55] nyxus-lock-cava frame
    color       = $nyxus_accent2_glow
    font_size   = 44
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 2
    shadow_size   = 16
    shadow_color  = $nyxus_accent2_glow
    shadow_boost  = 1.4
    position = 3, 8
    halign   = center
    valign   = center
}
# ★ LIVE AUDIO SPECTRUM — prism front layer
label {
    monitor     =
    text        = cmd[update:50] nyxus-lock-cava frame
    color       = $nyxus_accent_rgba
    font_size   = 44
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 3
    shadow_size   = 20
    shadow_color  = $nyxus_accent_glow
    shadow_boost  = 1.8
    position = 0, 10
    halign   = center
    valign   = center
}

# PASSWORD INPUT (prism gradient rim, frosted inner)
input-field {
    monitor =
    size              = 380, 54
    outline_thickness = 2
    dots_size         = 0.26
    dots_spacing      = 0.22
    dots_center       = true
    dots_rounding     = -1
    outer_color = $nyxus_accent_rgba $nyxus_accent2_rgba 45deg
    inner_color = rgba(10, 8, 20, 0.55)
    font_color  = rgba(238, 242, 250, 0.95)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = true
    fade_timeout  = 1200
    placeholder_text = <span foreground='##9aa0ad'>unlock</span>
    rounding = 12
    check_color     = rgba(255, 138, 30, 1.0)
    fail_color      = rgba(255, 45, 85, 1.0)
    fail_text       = ACCESS DENIED
    capslock_color  = rgba(255, 138, 30, 1.0)
    numlock_color   = -1
    bothlock_color  = -1
    invert_numlock  = false
    swap_font_color = false
    shadow_passes = 4
    shadow_size   = 16
    shadow_color  = $nyxus_accent_glow
    shadow_boost  = 1.3
    position = 0, -90
    halign   = center
    valign   = center
}

# WRONG PASSWORD
label {
    monitor     =
    text        = $FAIL
    color       = rgba(255, 45, 85, 0.95)
    font_size   = 11
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 2
    shadow_size   = 8
    shadow_color  = rgba(255, 45, 85, 0.5)
    position = 0, -150
    halign   = center
    valign   = center
}

# KEYBOARD LAYOUT / CAPS (rim goes gold on caps)
label {
    monitor     =
    text        = K B D · $LAYOUT[en]
    color       = rgba(255, 138, 30, 0.60)
    font_size   = 9
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 1
    shadow_size   = 4
    shadow_color  = rgba(255, 138, 30, 0.25)
    position = 0, -178
    halign   = center
    valign   = center
}

# ══ BACK LAYER · corner chrome (dim, small, set back) ═══════

# top-left — host / kernel
label {
    monitor     =
    text        = cmd[update:600000] echo "$(cat /etc/hostname 2>/dev/null || echo nyxus) · $(uname -r)" | tr '[:lower:]' '[:upper:]'
    color       = rgba(200, 204, 214, 0.55)
    font_size   = 10
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 1
    shadow_size   = 4
    shadow_color  = rgba(0, 0, 0, 0.8)
    position = 46, -40
    halign   = left
    valign   = top
}

# top-right — weather
label {
    monitor     =
    text        = cmd[update:600000] nyxus-weather-line
    color       = rgba(200, 240, 255, 0.85)
    font_size   = 22
    font_family = Caveat
    shadow_passes = 2
    shadow_size   = 8
    shadow_color  = rgba(0, 0, 0, 0.7)
    position = -46, -38
    halign   = right
    valign   = top
}

# bottom-left — now-playing art
image {
    monitor     =
    path        = ~/.cache/nyxus/lock-art-placeholder.png
    size        = 128
    rounding    = 14
    border_size = 1
    border_color = $nyxus_accent_rgba $nyxus_accent2_rgba 45deg
    reload_time = 5
    reload_cmd  = nyxus-lock-art
    shadow_passes = 3
    shadow_size   = 16
    shadow_color  = rgba(0, 0, 0, 0.55)
    position = 56, 132
    halign   = left
    valign   = bottom
}
# bottom-left — track / artist beside the art
label {
    monitor     =
    text        = cmd[update:5000] nyxus-lock-track title
    color       = rgba(238, 242, 250, 0.88)
    font_size   = 15
    font_family = Caveat
    shadow_passes = 1
    shadow_size   = 5
    shadow_color  = rgba(0, 0, 0, 0.7)
    position = 200, 168
    halign   = left
    valign   = bottom
}
label {
    monitor     =
    text        = cmd[update:5000] nyxus-lock-track artist
    color       = rgba(200, 204, 214, 0.65)
    font_size   = 12
    font_family = JetBrainsMono Nerd Font
    position = 200, 140
    halign   = left
    valign   = bottom
}

# bottom-right — daily line (cyan easter egg)
label {
    monitor     =
    text        = cmd[update:60000] ~/.config/hypr/scripts/nyxus-daily-line.sh
    color       = rgba(102, 239, 255, 0.60)
    font_size   = 16
    font_family = Caveat
    shadow_passes = 1
    shadow_size   = 5
    shadow_color  = rgba(102, 239, 255, 0.20)
    position = -50, 48
    halign   = right
    valign   = bottom
}

# bottom-centre — signature
label {
    monitor     =
    text        = NYXUS
    color       = $nyxus_accent_dim
    font_size   = 18
    font_family = Permanent Marker
    shadow_passes = 2
    shadow_size   = 10
    shadow_color  = $nyxus_accent_glow
    shadow_boost  = 1.1
    position = 0, 40
    halign   = center
    valign   = bottom
}
