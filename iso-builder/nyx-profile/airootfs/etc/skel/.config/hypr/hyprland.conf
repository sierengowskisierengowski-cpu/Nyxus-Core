monitor=,preferred,auto,1

$mod = SUPER

# ── Autostart ────────────────────────────────────────────────────────────────
# PATH (rev 2026-07-29): there is deliberately NO `env = PATH,...` line here.
#
# There used to be one, spelling out an absolute PATH so ~/.local/bin was
# reachable when a display manager (not a login shell) started the session.
# Two things make that both unnecessary and actively harmful now:
#
#   1. `env = PATH,<list>` REPLACES PATH outright — Hyprland cannot prepend and
#      cannot expand $HOME. The list that shipped was captured off the BUILD
#      machine, so it hardcoded /home/cosmic/... : a user that exists on no
#      installed system and not on the live ISO (the live user is `nyx`). It
#      therefore contributed three dead entries and, worse, DROPPED the real
#      user's ~/.local/bin — the very directory it was added to guarantee.
#   2. The fix belongs at the session entrypoint, and is already there:
#      nyxus-session-start (the Exec= of nyxus-hyprland.desktop, i.e. how every
#      greetd login enters the session) does
#      `export PATH="${HOME}/.local/bin:${PATH}"`. That is username-agnostic and
#      is inherited by Hyprland and every exec-once child.
#
# The exec-once lines below additionally self-heal with an explicit
# `export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"` so the bar-restore chain
# is PATH-independent no matter how the session was launched. Every NYXUS
# binary also ships in /usr/local/bin, which is on the default PATH regardless.
#
# Do NOT reintroduce a hardcoded `env = PATH,...` line — it can only ever be
# correct for the one machine it was copied from.

# A2 FIX (2026-05-12): nyxus-bootstrap MUST be started before any
# nyxus-wait-bootstrap-gated line, otherwise the marker file
# ~/.nyxus/.bootstrapped never gets written and every gated exec-once
# below blocks for 120s then runs against a half-installed system.
# Run unconditionally (it self-gates via marker + version check).
exec-once = nyxus-bootstrap >>/tmp/nyxus-bootstrap.log 2>&1
# EWW (ElKowar's Wacky Widgets) replaces waybar as of 2026-05-11.
# LOGIN RECOVERY (rev 2026-07-14): the desktop comes up on EVERY login via
# nyxus-persist-login — the single source of truth documented in
# docs/REBOOT_SURVIVAL.md. It compiles the CSS, restores the wallpaper, then
# runs nyxus-eww-launch-safe (guarantees exactly ONE eww daemon + all four
# bars), verifies >=4 bars, and auto-restores from the GOLD snapshot if any
# are still missing.
#
# This REPLACES the old pair of racing exec-once lines:
#     exec-once = ... sh -c 'pidof eww >/dev/null || eww daemon'
#     exec-once = ... nyxus-eww-launch
# Hyprland fires exec-once lines in PARALLEL, so `eww daemon` and the
# launcher raced: nyxus-eww-launch waited 30s for the IPC socket with NO
# retry and NO recovery, so whenever the daemon was slow to compile or
# crashed the bars silently never appeared and had to be relaunched by hand
# (see the "no eww daemon socket after 30s" errors in
# ~/.cache/nyxus-eww/launch.log). persist-login owns the daemon lifecycle
# itself, so there is nothing left to race.
#
# PATH SELF-HEAL (rev 2026-07-14b): the `env = PATH,…` line above is NOT
# reliably inherited by exec-once children when the session is launched by a
# display manager (greetd) with a stale /usr/local/bin/nyxus-session-start —
# Hyprland's own environ then lacks ~/.local/bin and every launcher below
# fails "command not found", so NO bars come back after login (verified via
# /proc/<exec-once-pid>/environ). We therefore prepend ~/.local/bin +
# /usr/local/bin to PATH inside the exec-once itself so the restore chain is
# fully PATH-independent regardless of how the session was started. This is
# the belt-and-suspenders partner to the export in nyxus-session-start.
#
# BAR/WALLPAPER RACE (2026-07-26): exec-once lines fire in parallel, so the
# bars' exclusive-zone surfaces can claim screen space before the wallpaper
# exec-once (further down) has a frame up -- a brief solid box behind the
# bars on a cold boot. Short head-start delay, not a bootstrap/network gate.
exec-once = sh -c 'export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"; sleep 0.6; exec nyxus-wait-bootstrap nyxus-persist-login'
# Safety net: ~15s after login, if fewer than 4 bars are up (or the CSS is
# broken) bring them back. No-op on the happy path — nyxus-boot-check exits
# 0 the moment it sees four healthy bars. Same PATH self-heal as above.
exec-once = sh -c 'export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"; exec nyxus-wait-bootstrap sh -c "sleep 15; nyxus-boot-check"'
# NYXUS dock daemon — disabled (user uses bar-bottom only; no floating dock strip)
# exec-once = systemctl --user start nyxus-dockd.service
exec-once = systemctl --user start nyxus-hotkeyd.service
exec-once = systemctl --user start nyxus-snapd.service
exec-once = systemctl --user start nyxus-missiond.service
exec-once = systemctl --user start nyxus-qsd.service

# ── Tier A polish (rev 2026-05-14): KDE Connect tray + EasyEffects EQ ──
# kdeconnectd: device discovery & file/text share daemon (NYXUS Drop)
# kdeconnect-indicator: tray icon w/ device list
# easyeffects --gapplication-service: keeps the audio pipeline pre-warmed
# so SoundPage's preset switcher applies instantly.
exec-once = /usr/bin/kdeconnectd
exec-once = kdeconnect-indicator
exec-once = easyeffects --gapplication-service

exec-once = hypridle
exec-once = dunst
# Alien desktop companion — DISABLED until the full-body game-character
# redo lands (bust-on-saucer was wrong). Re-enable with:
#   exec-once = nyxus-wait-bootstrap sh -c 'sleep 8; nyxus-companion start'
# exec-once = nyxus-wait-bootstrap sh -c 'sleep 8; nyxus-companion start'
# NYXUS cosmic sound theme (rev 2026-07-14) — login/startup chime. The
# short sleep lets PipeWire settle so the first sound isn't dropped;
# nyxus-sound fails silent if audio is unavailable or the theme is muted.
exec-once = sh -c 'sleep 4; nyxus-sound login'
exec-once = sh -c 'sleep 1; for p in $(pgrep -x hyprlock 2>/dev/null); do kill "$p" 2>/dev/null || true; done'
# live-wallpaper aware: starts mpvpaper if the user enabled the living
# wallpaper, otherwise falls through to the stock still-image autostart.
exec-once = sh -c 'command -v nyxus-live-wallpaper >/dev/null && nyxus-live-wallpaper auto || /usr/local/bin/nyxus-wallpaper-autostart' &
exec-once = systemctl --user start nyxus-ws-wallpaperd.service
exec-once = nyxus-wait-bootstrap sh -c 'hyprctl setcursor NYXUS-Aurora 24'
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# ── NYXUS Native GTK4 Apps — launch at startup ───────────────────────────────
# SysMon is on-click only (waybar icon launches it). No auto-launch on workspace 6.
# NYXUS Home — dashboard on named workspace "0" (its OWN page, completely
# outside the numbered 1-10 range so the user keeps every numbered slot free
# for future pages they're planning to add).
# Pin the home window to workspace name:0 no matter where it spawns from.
# DISABLED 2026-07-26: this launches the nyxus-home GTK app, which renders an
# EMPTY window - the grid builds fine (verified: _build_grid returns a live
# GtkGrid) but nothing ever paints. Six modules were also missing from the
# deployed ~/.nyxus/nyxus-home copy (hud/deck/hero/aurora/sentinel/notif) and
# have been restored from ~/.config/nyxus/nyxus-home.
# Owner wants persistent eww WIDGETS pinned to the HOME station instead of a
# maximised app window - re-enable only if that app is ever fixed.
# exec-once = [workspace name:HOME silent] sh -c 'sleep 1 && nyxus-home'
#
# HOME STATION DECK (2026-07-27). The eww `home-deck` window IS the home page.
# eww layer-shell surfaces bind to a MONITOR, not a workspace, so the deck
# cannot hide itself - nyxus-home-deck follows the Hyprland socket2 stream and
# opens it on HOME / closes it everywhere else. Without this exec-once nothing
# ever launches that watcher, so the deck never comes back after a reboot.
exec-once = sh -c 'export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"; exec nyxus-wait-bootstrap nyxus-home-deck'
# Super+Home → NYXUS Home workspace · Super+Shift+Home → relaunch if closed
# (was `name:0`; the station was renamed to name:HOME on 2026-07-26, so the old
#  bind landed on a stray workspace that is not the home page.)
bind = $mod, Home, workspace, name:HOME
bind = $mod SHIFT, Home, exec, sh -c 'export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"; pkill -f nyxus-home-deck; exec nyxus-home-deck'
# Super+End -> the big NYXUS Start panel (its own station). Replaces the
# nyxus-start GTK4 app, which sat on the OVERLAY layer and could not be
# closed or moved when it did not hold keyboard focus.
bind = $mod, End, workspace, name:START
# Super+Delete -> LAB, completing the named-station nav cluster (Home=HOME,
# End=START, Delete=LAB). LAB shipped as a named workspace with NO keybind and
# NO rail pill (the rail loop only covers the numbered 1-10 matrix), so it was
# reachable only via `hyprctl dispatch workspace name:LAB` - a real gap, and the
# reason the "half-station" recommendation is: named annex stations need a bind
# added here to be first-class. See docs/PROJECT_INVENTORY / HANDOFF.
bind = $mod, Delete, workspace, name:LAB
# Compositor-level escape hatch: kills the OLD GTK app if it is ever run and
# traps the screen again. Does not depend on the app's own key handling.
bind = $mod SHIFT, End, exec, pkill -f 'nyxus-start/main.py'
# Force-close the START search overlay. It is the ONE eww window that takes
# keyboard focus (eww 0.5 only offers EXCLUSIVE interactivity), so it gets a
# compositor-level escape hatch that does not depend on the window itself.
# NOTE: was $mod SHIFT, S (scratchpad) then SHIFT, X (prism-pulse) - both
# (movetoworkspace special:magic) further down this file, and the duplicate
# failed the repo's ISO-readiness validator ("duplicate keybind chords").
bind = $mod SHIFT, Z, exec, eww close start-search
bind = $mod SHIFT, N,      exec, sh -c 'export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"; nyxus-welcome-note --force'

# ── First-Boot Welcome Wizard (rev r9-eww · Wave 2 / Sprint 2a) ─────────────
# Runs ONCE on first interactive login. The launcher script self-gates
# via ~/.config/nyxus/welcome.done — once that file exists, this becomes a no-op.
# Quietly exits in 2s on subsequent boots (no startup-time penalty).
# Must call /usr/local/bin/nyxus-welcome (verify-profile + first-boot autostart).
exec-once = nyxus-wait-bootstrap sh -c '[ -f "$HOME/.config/nyxus/welcome.done" ] || (sleep 3; /usr/local/bin/nyxus-welcome)'

# ── Welcome Transmission (rev 2026-07-24) — borderless kitty poem/riddle ────
exec-once = sh -c 'export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"; [ -f "$HOME/.config/nyxus/welcome-note.done" ] || (sleep 4; nyxus-welcome-note)'


# ── NYXUS Floating Widgets — uncomment to pin to desktop ─────────────────────
# exec-once = /usr/local/bin/nyxus-weather &
# exec-once = python3 ~/.nyxus/nyxus_stickies.py &
# exec-once = /usr/local/bin/nyxus-notepad &

# ── Environment ──────────────────────────────────────────────────────────────
env = GTK_THEME,adw-gtk3-dark
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,NYXUS-Aurora
env = HYPRCURSOR_THEME,NYXUS-Aurora
env = HYPRCURSOR_SIZE,24
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_QPA_PLATFORMTHEME,qt5ct   # qt6ct plugin answers to both keys; qt5ct themes Qt5 apps too
env = MOZ_ENABLE_WAYLAND,1
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland

# ── NVIDIA hybrid-graphics env (LOCKED · 2026-05-10 · MSI GS77 i9+RTX3060) ──
# Per Hyprland Nvidia wiki. Required for proper Wayland + Electron support
# on Intel-iGPU + NVIDIA-dGPU hybrid laptops. Pairs with the i915-first
# MODULES order in /etc/mkinitcpio.conf — both must be present.
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = NVD_BACKEND,direct

# ── Input ────────────────────────────────────────────────────────────────────
input {
    kb_layout    = us
    follow_mouse = 1
    sensitivity  = 0

    touchpad {
        natural_scroll       = true
        disable_while_typing = true
        tap-to-click         = true
    }
}

# ── Touchpad gestures (rev 2026-07-07) ───────────────────────────────────────
# 3-finger horizontal swipe glides between workspaces with live preview —
# pairs with the slidefade workspace animation for a liquid page-turn feel.
# (4-finger-down for Mission Control stays parked in the mission shard.)
gesture = 3, horizontal, workspace

# ── General ──────────────────────────────────────────────────────────────────
general {
    gaps_in     = 6
    gaps_out    = 14
    border_size = 3

    # PRISM rim (rev 2026-07-06) — fallback copy of the iridescent gradient
    # in nyxus-hyprland-general.conf (the shard is sourced later and wins;
    # this stays so the desktop keeps its ring if the shard is ever removed).
    # Slow 240-frame borderangle revolution = lazy chromatic breathing
    # around the focused window, matching the dark-glass app chrome.
    col.active_border   = rgba(7d3dffff) rgba(ff2dadff) rgba(2bd2ffff) rgba(39ff14ff) 270deg
    col.inactive_border = rgba(7d3dff22) rgba(ff2dad22) rgba(2bd2ff22) 135deg

    layout           = dwindle
    resize_on_border = true
}

# ── Decoration ───────────────────────────────────────────────────────────────
decoration {
    rounding = 12

    # Inactive opacity kept light so stacked windows stay legible. The old
    # 0.88 combined with passes=3 below caused the "blurred soup" effect
    # where browser tabs underneath an active window became unreadable.
    # HIGH BLUR mode (rev 2026-05-06w): big Dual-Kawase kernel + 4 passes
    # for deep frosted-glass behind every window. Inactive opacity dropped
    # to 0.85 so the cosmic wallpaper reads strongly through stacked windows.
    # Transparent frosted desktop (Phase 5 rev 2026-07-14): windows ride a
    # touch lower so the cosmic wallpaper reads through the deep blur while
    # text stays legible. Tune here if any app gets too see-through.
    active_opacity   = 0.90
    inactive_opacity = 0.80

    blur {
        enabled           = true
        size              = 14     # kernel radius per pass — HIGH
        passes            = 4      # 4 passes = deep frosted glass
        new_optimizations = true
        xray              = true   # sample wallpaper only, no smear
        noise             = 0.015
        contrast          = 1.05   # crisp text through deep frost
        brightness        = 0.92
        vibrancy          = 0.30   # cool cosmic shimmer
        vibrancy_darkness = 0.10
        popups            = true
        popups_ignorealpha = 0.20
        ignore_opacity    = true   # blur even fully-opaque windows
    }

    # ALIEN NEON drop shadow — pure ink, no bloom, no color.
    # Sits behind every window as real shadow on the wallpaper.
    shadow {
        enabled        = true
        range          = 36
        render_power   = 3
        sharp          = false
        color          = rgba(39ff143a)
        color_inactive = rgba(00000033)
        offset         = 2 4
    }
}

# ── Animations ───────────────────────────────────────────────────────────────
animations {
    enabled = true

    # ── Spring-approximating beziers (rev r15 · 2026-05-10) ─────────────
    # Hyprlang has no native spring curves (those landed in the new Lua
    # API in 0.55); these beziers fake spring physics by using overshoot
    # control points, so windows "land" onto the desktop with a subtle
    # settle instead of a flat ease-out. Tuned conservatively to stay on
    # the ALIEN NEON side of polished — no clownish bounce.
    bezier = nyx-spring, 0.34, 1.36, 0.64, 1.0
    # ↑ gentle back.out — ~6% overshoot, settles in one motion
    bezier = nyx-glass,  0.16, 1.0,  0.2,  1.0
    # ↑ critically-damped settle — feels like landing on glass, no bounce
    bezier = nyxus,      0.05, 0.9,  0.1,  1.05
    bezier = nyx-out,    0.4,  0.0,  1.0,  1.0
    bezier = overshoot,  0.1,  0.85, 0.1,  1.18
    bezier = nyx-soft,   0.25, 0.46, 0.45, 0.94
    bezier = nyx-sharp,  0.16, 1.0,  0.3,  1.0
    bezier = linear,     0.0,  0.0,  1.0,  1.0

    animation = windows,          1, 4,  nyx-glass,  slide
    animation = windowsIn,        1, 5,  nyx-spring, popin 92%
    animation = windowsOut,       1, 3,  nyx-out,    popin 60%
    animation = windowsMove,      1, 4,  nyx-glass,  slide
    animation = border,           1, 10, default
    animation = borderangle,      1, 240, linear, loop
    animation = fade,             1, 5,  nyx-out
    animation = fadeIn,           1, 4,  nyx-glass
    animation = fadeOut,          1, 3,  nyx-out
    animation = workspaces,       1, 5,  nyx-spring, slidefade 15%
    animation = specialWorkspace, 1, 5,  nyx-glass,  slidevert
}

# ── Layout ───────────────────────────────────────────────────────────────────
# rev r8-eww 2026-05-11 — Hyprland 0.55+ removed `dwindle:pseudotile`
# (the pseudotile *dispatcher* still exists; only the config option was
# dropped). `preserve_split` survives. Empty `master {}` block also
# removed — 0.55+ rejects empty plugin blocks with a parse error.
dwindle {
    preserve_split = true
}

# ── Misc ─────────────────────────────────────────────────────────────────────
# rev r8-eww 2026-05-11 — Hyprland 0.55+ removed `misc:vfr` (VFR is now
# always-on, controlled per-monitor). Other options survive.
misc {
    force_default_wallpaper  = 0
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    mouse_move_enables_dpms  = true
    key_press_enables_dpms   = true
    focus_on_activate        = true
    # freeform-mode motion polish (rev 2026-07-07): manual drags and
    # resizes glide with the nyx-glass bezier instead of jumping —
    # floating windows feel physical.
    animate_manual_resizes        = true
    animate_mouse_windowdragging  = true
}

# hide the cursor after 5 idle seconds — keeps the living wallpaper
# and glass stack clean when you're just reading or listening
cursor {
    inactive_timeout = 5
}

# Apps come to front when clicked via misc.focus_on_activate=true (above).
# Note: bringactivetotop is NOT a valid hyprland windowrule keyword.


# ─────────────────────────────────────────────────────────────────────────────
# KEY BINDINGS
# ─────────────────────────────────────────────────────────────────────────────

# ── Apps ─────────────────────────────────────────────────────────────────────
# rev r24 (2026-07-14 · Phase 3) — the terminal binds a REAL terminal directly
# (kitty -> alacritty -> foot). The old $mod+Return ran nyxus_terminal.py (the
# "Cosmic Terminal"), which was broken. App launching is consolidated onto ONE
# key: $mod+Space (native nyxus_launcher.py, with a rofi/wofi fallback). The old
# duplicate drun launchers $mod+D (startmenu.rasi) and $mod+R (launcher.rasi) are
# REMOVED — see docs/KEYBINDS.md. $mod+Shift+D stays as the raw run prompt.
bind = $mod,       Return,  exec, sh -c '(command -v kitty >/dev/null && kitty) || (command -v alacritty >/dev/null && alacritty) || (command -v foot >/dev/null && foot)'
bind = $mod SHIFT, Return,  exec, sh -c '(command -v alacritty >/dev/null && alacritty) || (command -v kitty >/dev/null && kitty) || (command -v foot >/dev/null && foot)'
bind = $mod SHIFT, D,       exec, sh -c '(command -v rofi >/dev/null && rofi -show run) || (command -v wofi >/dev/null && wofi --show run)'
bind = $mod,       Tab,     exec, sh -c '(command -v rofi >/dev/null && rofi -show window -theme $HOME/.config/rofi/nyxus.rasi 2>/dev/null) || (command -v rofi >/dev/null && rofi -show window)'
bind = $mod,       E,       exec, sh -c '(command -v nautilus >/dev/null && nautilus) || (command -v thunar >/dev/null && thunar) || (command -v dolphin >/dev/null && dolphin) || xdg-open $HOME'
bind = $mod,       B,       exec, sh -c '(command -v chromium >/dev/null && chromium) || (command -v firefox >/dev/null && firefox) || (command -v chrome >/dev/null && chrome)'

# ── Lock / logout ─────────────────────────────────────────────────────────────
# NYXUS cosmic sound theme (rev 2026-07-14): Super+L routes through
# loginctl lock-session so hypridle's lock_cmd/unlock_cmd own the lock +
# unlock chimes (nyxus-sound lock|unlock — see hypridle.conf). Super+Shift+M
# plays the power-down chime just before Hyprland exits.
bind = $mod,       L,       exec, loginctl lock-session
bind = $mod SHIFT, E,       exec, wlogout --protocol layer-shell --layout ~/.config/wlogout/layout --css ~/.config/wlogout/style.css -b 3 -c 0 -r 0 -L 0
bind = $mod SHIFT, M,       exec, sh -c 'nyxus-sound logout; sleep 0.7; hyprctl dispatch exit'
# Global mute toggle for the NYXUS sound theme (flips ~/.config/nyxus/sound.state)
bind = $mod SHIFT, A,       exec, nyxus-sound toggle

# ── Window management ────────────────────────────────────────────────────────
bind = $mod,       Q,       killactive
bind = $mod,       V,       togglefloating
bind = $mod,       P,       pseudo
# rev r8-eww 2026-05-11 — `togglesplit` dispatcher removed in Hyprland
# 0.55+. The dwindle layout still alternates split direction
# automatically; if you want explicit control, use `layoutmsg, togglesplit`
# (now namespaced under the layout dispatcher).
# Phase 3 (2026-07-14): moved OFF $mod+T (claimed by nyxus-tint in
# conf.d/nyxus-signature.conf — silent duplicate) onto the free $mod+J.
bind = $mod,       J,       layoutmsg, togglesplit
bind = $mod,       F,       fullscreen, 0
bind = $mod SHIFT, F,       fullscreen, 1
bind = $mod SHIFT, C,       centerwindow

# ── NYXUS Phase 2 — launcher / powermenu / screenshot / doctor ───────────────
bind = $mod,       Space,   exec, sh -c '[ -f $HOME/.nyxus/nyxus_launcher.py ] && python3 $HOME/.nyxus/nyxus_launcher.py || (command -v rofi >/dev/null && rofi -show drun) || (command -v wofi >/dev/null && wofi --show drun)'
bind = $mod,       Escape,  exec, nyxus-overlay-open powermenu
# Hub / overlay escape hatch — plain Escape closes The Hub (and ANY other
# overlay/flyout) + restores bars. rev 2026-07-15: DENY-LIST gate — fires if
# ANY active eww window is open that isn't persistent chrome (bars/osd/dock),
# so it can never miss a window name (was missing quicksettings-daemon, etc.).
# All overlays are now :focusable false so this compositor bind always fires.
# WEDGE-PROOF (r2): the probe is `timeout`-bounded — a hung eww daemon makes
# the bare CLI block forever, which silently disabled this gate. If the probe
# itself fails/times out while an eww daemon process exists, that IS the
# wedged state → run nyxus-hub-close (it hard-recovers the daemon + bars).
bind = , Escape, exec, sh -c 'export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"; out=$(timeout -k 2 4 eww active-windows 2>/dev/null); rc=$?; n=$(printf "%s" "$out" | sed "s/:.*//" | sed "s/[[:space:]]//g" | grep -vE "^(bar-top|bar-bottom|bar-left|bar-right|osd-volume|osd-brightness|osd-mic|osd|dock|dock-reveal|snap-toast|notif-popup|)$" | grep -c .); { [ "$rc" -ne 0 ] && pgrep -x eww >/dev/null; } || [ "$n" -gt 0 ] && nyxus-hub-close'
# Always-on failsafe: Super+Shift+Escape force-dismisses everything, no gate.
# The bare `eww close nyxus-hub` runs FIRST and on its own: it is one socket
# round-trip, so the Hub is off the screen in milliseconds even if the longer
# recovery that follows is slow or fails outright. Before this, every single
# way out of the Hub -- both close buttons, the backdrop, plain Escape and
# this failsafe -- funnelled into nyxus-hub-close, so that one script was the
# only thing standing between the user and a fullscreen surface they could not
# dismiss. Cheap insurance against exactly that.
bind = $mod SHIFT, Escape, exec, sh -c 'export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"; timeout -k 1 3 eww close nyxus-hub 2>/dev/null; nyxus-hub-close'
# Last resort, no NYXUS script involved at all: close every eww window, then
# bring the bars back the sanctioned way. Use this if the Hub is stuck and
# Super+Shift+Escape did not clear it.
bind = $mod CTRL SHIFT, Escape, exec, sh -c 'export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"; timeout -k 1 4 eww close-all 2>/dev/null; nyxus-eww-launch-safe'
bind = $mod,       grave,   exec, nyxus-overlay-open dashboard
bind = ,           Print,   exec, python3 ~/.nyxus/nyxus_screenshot.py region
bind = SHIFT,      Print,   exec, python3 ~/.nyxus/nyxus_screenshot.py
bind = $mod SHIFT, H,       exec, alacritty -e python3 ~/.nyxus/nyxus_doctor.py
# ── NYXUS Security Center ────────────────────────────────────────────────────
# Super+Shift+Y       opens the full Security Center (firewall, AV,
#                     encryption, account, audit, panic).  (Super+Shift+S
#                     is reserved for the Hyprland scratchpad.)
# Super+Ctrl+Alt+L    PANIC LOCKDOWN — lock screen + clear clipboard
#                     + dismount removable media + flush DNS cache.
bind = $mod SHIFT, Y,       exec, sh -c 'command -v nyxus-security >/dev/null && nyxus-security || notify-send -u critical "NYXUS Security" "nyxus-security is not installed on this system"'
bind = $mod CTRL ALT, L,    exec, sh -c 'command -v nyxus-security >/dev/null && nyxus-security --panic || notify-send -u critical "NYXUS Security" "nyxus-security is not installed — panic mode unavailable"'
bind = $mod,       slash,   exec, eww open --toggle hotkey-cheatsheet
bind = $mod SHIFT, slash,   exec, eww open --toggle hotkey-cheatsheet

# ── NYXUS easter egg — secret chord ──────────────────────────────────────────
# Super+Shift+X spins the prism border gradient 3 full revolutions.
bind = $mod SHIFT, X,       exec, ~/.config/hypr/scripts/nyxus-prism-pulse.sh
# Dream Protocol (unlocked by welcome-note riddle)
bind = $mod ALT, D,        exec, sh -c 'export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"; nyxus-dream'

# ── NYXUS living wallpaper toggle ────────────────────────────────────────────
# Super+Alt+V flips between the animated video wallpaper and the still.
bind = $mod ALT, V,         exec, nyxus-live-wallpaper toggle

# ── NYXUS DEEP CORE — kernel + security-stack observatory ───────────────────
# Super+G shows kernel image/taint/LSM/mitigations, jeTT/Bifrost/Meli
# sentinel status, honeypot fleet count, and scheduler telemetry.
bind = $mod, G,             exec, eww open --toggle deepcore

# ── NYXUS Sprint 1 — EWW flyouts (rev r9-eww, 2026-05-11) ────────────────────
bind = $mod,       A,       exec, eww open --toggle quicksettings
bind = $mod,       N,       exec, eww open --toggle notifications
bind = $mod,       W,       exec, eww open --toggle wifi
bind = $mod,       M,       exec, eww open --toggle mixer
bind = $mod,       C,       exec, eww open --toggle calendar
bind = $mod SHIFT, B,       exec, eww open --toggle bluetooth

# ── Focus (arrow keys + WASD-style) ──────────────────────────────────────────
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod, H,     movefocus, l
bind = $mod, K,     movefocus, u
bind = $mod, semicolon, movefocus, r

# ── Move windows ─────────────────────────────────────────────────────────────
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# ── Resize ───────────────────────────────────────────────────────────────────
bind = $mod CTRL, left,  resizeactive, -40  0
bind = $mod CTRL, right, resizeactive,  40  0
bind = $mod CTRL, up,    resizeactive,   0 -40
bind = $mod CTRL, down,  resizeactive,   0  40

# ── Workspaces ───────────────────────────────────────────────────────────────
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# ── Companion ("half") stations — Super+Alt+<digit> (2026-07-28) ─────────────
# Every numbered station has a companion station: Super+<digit> reaches the
# primary, Super+Alt+<digit> reaches its companion. The left rail shows each
# one as a small dim ALIEN GLYPH (Tifinagh) under its primary number; the ten
# labels live in the `half_marks` table in stations.json.
#
# Workspace IDs are integers so these MUST be named workspaces — their
# persistent + defaultName + on-created-empty rules live in
# conf.d/nyxus-stations-named.conf, the curated shard nyxus-hacker-mode never
# regenerates. Names are used here (not glyphs) so this stays greppable and
# nyxus-home-deck can keep mapping stations by name.
bind = $mod ALT, 1, workspace, name:RELAY
bind = $mod ALT, 2, workspace, name:ANVIL
bind = $mod ALT, 3, workspace, name:TRACE
bind = $mod ALT, 4, workspace, name:BEACON
bind = $mod ALT, 5, workspace, name:MIXER
bind = $mod ALT, 6, workspace, name:VAULT
bind = $mod ALT, 7, workspace, name:SCAN
bind = $mod ALT, 8, workspace, name:BOARD
bind = $mod ALT, 9, workspace, name:SENTRY
bind = $mod ALT, 0, workspace, name:RANGE

bind = $mod ALT SHIFT, 1, movetoworkspace, name:RELAY
bind = $mod ALT SHIFT, 2, movetoworkspace, name:ANVIL
bind = $mod ALT SHIFT, 3, movetoworkspace, name:TRACE
bind = $mod ALT SHIFT, 4, movetoworkspace, name:BEACON
bind = $mod ALT SHIFT, 5, movetoworkspace, name:MIXER
bind = $mod ALT SHIFT, 6, movetoworkspace, name:VAULT
bind = $mod ALT SHIFT, 7, movetoworkspace, name:SCAN
bind = $mod ALT SHIFT, 8, movetoworkspace, name:BOARD
bind = $mod ALT SHIFT, 9, movetoworkspace, name:SENTRY
bind = $mod ALT SHIFT, 0, movetoworkspace, name:RANGE

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# ── Scratchpad ────────────────────────────────────────────────────────────────
bind = $mod,       S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace,        special:magic

# ── Mouse ────────────────────────────────────────────────────────────────────
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ── Media / Volume ───────────────────────────────────────────────────────────
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ && ~/.config/eww/scripts/osd-show.sh osd-volume
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && ~/.config/eww/scripts/osd-show.sh osd-volume
bind = , XF86AudioMute,        exec, wpctl set-mute   @DEFAULT_AUDIO_SINK@ toggle && ~/.config/eww/scripts/osd-show.sh osd-volume
bind = , XF86AudioMicMute,     exec, wpctl set-mute   @DEFAULT_AUDIO_SOURCE@ toggle && ~/.config/eww/scripts/osd-show.sh osd-mic
bind = , XF86AudioPlay,        exec, playerctl play-pause
bind = , XF86AudioNext,        exec, playerctl next
bind = , XF86AudioPrev,        exec, playerctl previous

# ── Brightness ───────────────────────────────────────────────────────────────
bind = , XF86MonBrightnessUp,   exec, brightnessctl set 10%+ && ~/.config/eww/scripts/osd-show.sh osd-brightness
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%- && ~/.config/eww/scripts/osd-show.sh osd-brightness

# ── Screenshot ───────────────────────────────────────────────────────────────
# Screenshots are the Python helper on Print / SHIFT+Print (this file) plus the
# $mod+Print / $mod+SHIFT+Print / $mod+CTRL+Print chords in nyxus-signature.conf.
# Phase 3 (2026-07-14): removed the old `$mod+SHIFT+W -> hyprshot` fallback — it
# silently duplicated $mod+SHIFT+W, which nyxus-signature.conf uses for
# nyxus-accent-from-wallpaper.

# ── Wallpaper (permanent — SIERENGOWSKI) ──────────────────────────────────────
# Set via exec-once at startup. Phase 3 (2026-07-14): Wallpaper Studio moved
# $mod+Alt+W -> $mod+Alt+S ("Studio") because nyxus-signature.conf uses
# $mod+Alt+W for nyxus-wall-next (cycle wallpaper) — they were duplicated.
bind = $mod ALT, S, exec, /usr/local/bin/nyxus wallpaper_studio &

# ── Game Mode / Focus Mode toggles ────────────────────────────────────────────
bind = $mod ALT, G, exec, /usr/local/bin/nyxus-gamemode toggle
bind = $mod ALT, F, exec, /usr/local/bin/nyxus-focusmode toggle

# ── Freeform / Tiling window mode toggle (rev 2026-07-07) ─────────────────────
# FREEFORM = every new window floats at natural size — move/resize at will,
# sizes remembered per app. TILING = classic dwindle. Super+V still floats
# a single window either way.
bind = $mod ALT, T, exec, nyxus-freeform toggle

# ── Named workspaces ──────────────────────────────────────────────────────────
# RETIRED (prune 2026-07-07): the old Main/Web/Code/Chat/... naming block
# lived here and FOUGHT the newer scheme in nyxus-hyprland-general.conf
# (persistent WEB/CODE/TERM/FILES/MEDIA/COMMS on 1-6, 7-10 lazy/unnamed).
# The general shard is the single source of truth for workspace identity —
# do not re-add defaultName rules here.
# Retired duplicate: Super+W belongs to the eww wifi panel (Phase 2 block).
# Wallpaper Studio lives on Super+Alt+W via /usr/local/bin/nyxus.
# bind = $mod, W, exec, python3 ~/.nyxus/nyxus_wallpaper_studio.py

# ── Quick Settings panel — positioned by the Python script via hyprctl IPC ────
# (window rules handled at runtime; no static rules needed here)

# ── NYXUS per-app window rules ───────────────────────────────────────────────
# MOVED to ~/.config/hypr/conf.d/nyxus-hyprland-rules.conf (sourced at end of
# this file). The unified `windowrule =` form misparses `bordersize N` and
# certain rule combos in Hyprland 0.51+ — every line below this point would
# cascade into 30+ "invalid field" errors on screen. The shard uses the
# current `windowrule =` keyword which parses cleanly on every version.
# DO NOT re-add per-app rules here — they belong in the shard.

# ── Chromium / Electron translucency (LOCKED · 2026-05-10 · ALIEN NEON) ─────
# Apply system-level opacity + Dual-Kawase blur to every Chromium-class and
# Electron-class window. The compositor handles this — apps don't need to
# know they're being made translucent. Pairs with the triple-black surface
# stack (BLACK_SMOKE / INK / VOID) so chromium chrome blends into the
# wallpaper/wallpaper-blur layer instead of slamming a solid white panel
# over everything.
#
# Numbers: active 0.92 / inactive 0.82 — slightly more opaque than the
# wlogout/popover pebbles because a browser tab needs to stay readable.
# If text becomes hard to read on a busy wallpaper, raise these toward 1.0.
windowrule = opacity 0.92 0.82, match:class ^([Cc]hromium|[Bb]rave-browser|[Gg]oogle-chrome|[Mm]icrosoft-edge|[Vv]ivaldi-stable|[Ee]lectron|VSCodium|[Cc]ode|code-oss|code-url-handler|discord|vesktop|[Ss]lack|obsidian|[Nn]otion|spotify)$
windowrule = no_shadow on, match:class ^([Cc]hromium|[Bb]rave-browser|[Gg]oogle-chrome|[Mm]icrosoft-edge|[Vv]ivaldi-stable|[Ee]lectron|VSCodium|[Cc]ode|code-oss|code-url-handler|discord|vesktop|[Ss]lack|obsidian|[Nn]otion|spotify)$
# Note: window-level blur is enabled globally via `decoration { blur { ... } }`
# above — these rules just adjust opacity. To opt OUT of blur for a specific
# class, add  `windowrule = noblur, class:^foo$`  here.

# ── Layer blur ───────────────────────────────────────────────────────────────
# REMOVED: previously had `layerrule = blur, namespace:^waybar$` etc. but
# Hyprland 0.54.3 mis-parses the `namespace:^X$` matcher form ("invalid field
# blur: missing a value"). The bare-regex form is the only working syntax,
# and the nyxus-hyprland-layerblur.conf shard already covers waybar / rofi /
# launcher / notifications / wlogout / hyprlock with the correct syntax —
# duplicating here just creates 4 more red errors on screen for nothing.

# ─────────────────────────────────────────────────────────────────────────────
# NYXUS modular configs (ALIEN NEON rev 2026-05-07 r14)
# These six files live in ~/.config/hypr/conf.d/ and carry the locked
# ALIEN NEON window rules, opacity, blur tuning, fog daemon hooks,
# layer-shell blur, and general behavior. Without these `source =` lines,
# the modular confs are orphaned and Hyprland never applies the NYXUS
# transparency / frost / opacity policy — apps render flat and opaque.
# ─────────────────────────────────────────────────────────────────────────────
source = ~/.config/hypr/conf.d/nyxus-hyprland-general.conf
# NYXUS Station Matrix — single source of truth for workspace 1-10 identity
# (OPS/FORGE/GHOST/PULSE/WAVE/CORE/MESH/SCRIBE/BLAST/EDGE). Matches
# ~/.config/nyxus/stations.json and the EWW left rail. Sourced right after
# general so the semantic names win (reconciliation rev 2026-07-15).
source = ~/.config/hypr/conf.d/nyxus-stations.conf
# Sourced right after the generated matrix: nyxus-stations.conf is rewritten
# from scratch by nyxus-hacker-mode on every mode flip and its generator only
# emits the numbered stations, so HOME/START/LAB and the Bifrost window pins
# live in this CURATED shard where a flip cannot delete them (2026-07-28).
source = ~/.config/hypr/conf.d/nyxus-stations-named.conf
source = ~/.config/hypr/conf.d/nyxus-hyprland-rules.conf
source = ~/.config/hypr/conf.d/nyxus-hyprland-opacity.conf
source = ~/.config/hypr/conf.d/nyxus-hyprland-blur.conf
source = ~/.config/hypr/conf.d/nyxus-hyprland-layerblur.conf
source = ~/.config/hypr/conf.d/nyxus-hyprland-fog.conf
source = ~/.config/hypr/conf.d/nyxus-hyprland-mission.conf
source = ~/.config/hypr/conf.d/nyxus-hyprland-flair.conf
source = ~/.config/hypr/conf.d/nyxus-signature.conf
# freeform/tiling mode shard — GENERATED by nyxus-freeform, sourced LAST
# so its catch-all float rules see the per-app overrides already set
source = ~/.config/hypr/conf.d/nyxus-freeform.conf
# Sourced AFTER freeform on purpose: nyxus-consoles.conf carries the `float
# off` exceptions that let the four security consoles TILE, and freeform's
# catch-all `float on, class ^(.*)$` would otherwise apply to them too.
source = ~/.config/hypr/conf.d/nyxus-consoles.conf

# ── SHARDS THAT SHIPPED UNSOURCED (fixed 2026-07-29) ────────────────────────
# All four of these were present in conf.d, committed, staged by the bake -- and
# never sourced, so every keybind and window rule in them was dead on arrival.
# Two of them even say "sourced from hyprland.conf" in their own header. Between
# them that was 9 keybinds and 24 window rules that did nothing.
#
# Verified before enabling: zero chord collisions against the already-sourced
# set (the one real duplicate, Super+Alt+0, is fixed in nyxus-hyprland-flair.conf).
#
# Arsenal window rules: 19 rules that float/size/park the native security tools
# (CIPHER, Forge, RedForge, GSL, Trainer, AXIOM), which all share the Wayland
# class "NYXUS App". Unsourced, they opened unfloated and unsized. This is the
# THIRD time this shard has been the one that fell through -- it was the W6 fix
# on 2026-07-24 and it regressed.
source = ~/.config/hypr/conf.d/nyxus-arsenal-apps.conf
# Reactive suite keybinds: Machine Whispers, SUPERNOVA and the Graffiti Memory
# Wall -- three of the four headline "reactive features" -- had no working
# keybind at all.
source = ~/.config/hypr/conf.d/nyxus-reactive.conf
# Aurora pack: X-RAY PEEK and the other pure-compositor effects (4 binds).
source = ~/.config/hypr/conf.d/nyxus-hyprland-aurora.conf
# COMET-FIRE add-on. Its header says "sourced LAST from hyprland.conf" and it is
# deliberately last here, so its rules land on top of the other shards'.
source = ~/.config/hypr/conf.d/nyxus-cometfire.conf
#
# NOT SOURCED, ON PURPOSE: nyxus-safemode.conf is a standalone recovery profile
# loaded only by nyxus-hypr-launch in Safe Mode. Its own header says so. Do not
# add it here.

# nyxus monitor overrides (auto-managed by Settings)
source = ./nyxus-monitors.conf
