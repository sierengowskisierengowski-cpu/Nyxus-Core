# nyxus-windowrules.conf — Real-OS window behaviour (rev r15)
#
# Per the user-locked Sprint B "Real-OS desktop" contract: every NYXUS
# app must open as a draggable, freely-resizable floating window — NOT
# tiled. This matches the Windows / macOS user expectation that a
# launched app appears in its own movable window with a title bar.
#
# Non-NYXUS apps (browsers, IDEs, etc.) keep the default tiling behaviour
# Hyprland was configured for in hyprland.conf — only NYXUS-branded
# windows are forced floating here.

# ── 1. Float every NYXUS-branded app ───────────────────────────────
# Matches: nyxus, NYXUS, nyxus-*, NYXUS-*, nyxus_*, com.nyxus.*, io.nyxus.*
windowrulev2 = float,           class:^(nyxus.*|NYXUS.*|com\.nyxus\..*|io\.nyxus\..*)$
windowrulev2 = center 1,        class:^(nyxus.*|NYXUS.*|com\.nyxus\..*|io\.nyxus\..*)$

# ── 2. Always allow drag/resize on NYXUS app windows ───────────────
# (No "noinitialfocus" — NYXUS apps grab focus on open like a normal OS.)
windowrulev2 = focusonactivate,  class:^(nyxus.*|NYXUS.*|com\.nyxus\..*|io\.nyxus\..*)$

# ── 3. Title-bar feel — keep our 1px frosted border + no default shadow ─
# (chrome.py sets the visual shell; we just keep WM borders predictable.)
windowrulev2 = bordersize 1,     class:^(nyxus.*|NYXUS.*|com\.nyxus\..*|io\.nyxus\..*)$

# ── 4. Sensible exemptions — overlays/popups stay anchored ─────────
# Power menu, launcher, screenshot HUD, screensaver, splash, OSDs are
# fullscreen layer surfaces or compact popups — they must NOT float in
# the "movable window" sense; they should stay where the daemon places
# them. install_chrome already tags these with _nyxus_fixed_layout=True.
windowrulev2 = pin,              class:^(nyxus-launcher|nyxus-powermenu|nyxus-screenshot|nyxus-splash|nyxus-screensaver)$
windowrulev2 = nofocus,          class:^(nyxus-toast|nyxus-osd-.*)$

# ── 4b. Sprint C — Notification Center drawer (rev r15) ────────────
# When opened with --drawer, nyxus_settings_notifications.py prefers
# gtk4-layer-shell anchoring; if the layer-shell binding is missing,
# these rules pin it to the right screen edge as a fallback so it still
# behaves like a macOS / Windows 11 Notification Center drawer.
windowrulev2 = float,            class:^(com\.nyxus\.notifications)$
windowrulev2 = move 100%-w-8 16, class:^(com\.nyxus\.notifications)$
windowrulev2 = pin,              class:^(com\.nyxus\.notifications)$
windowrulev2 = noborder,         class:^(com\.nyxus\.notifications)$

# ── 5. Real-OS keybindings users coming from Windows/macOS expect ──
# (These layer on top of the existing $mod-based tiling shortcuts; both
# work simultaneously.)
bind = ALT,   F4,     killactive                    # Windows-style close
bind = SUPER, M,      fullscreen, 1                 # macOS-style maximize
bind = SUPER SHIFT, M, fullscreen, 0                # macOS-style restore
bind = SUPER, H,      movetoworkspacesilent, special:minimized   # macOS-style hide
bind = SUPER, comma,  exec, nyxus-settings          # macOS-style preferences

# ── 6. Desktop right-click is wired in nyxus_desktop.py via the
#     wallpaper layer surface; nothing to bind here. Title-bar
#     right-click is wired in nyxus_chrome.py (install_chrome)
#     via a Gtk.GestureClick on the HeaderBar.

# ── 7. Real interactive Move / Resize submaps (rev r15) ───────────
# Windows / macOS "Move" and "Resize" from the title-bar window menu
# enter a modal grab state where arrow keys (or pointer) reposition
# the window until Esc/Enter exits. Hyprland has no one-shot interactive
# grab via hyprctl, so we model it via submaps. nyxus-window-menu.sh
# enters these via `hyprctl dispatch submap windowmove|windowresize`.
submap = windowmove
# Arrows = coarse 30px step; SHIFT+arrows = fine 10px step.
# Mirrors the resize submap below for symmetric Real-OS UX.
bind = ,    left,  moveactive, -30 0
bind = ,    right, moveactive,  30 0
bind = ,    up,    moveactive,  0 -30
bind = ,    down,  moveactive,  0  30
bind = SHIFT, left,  moveactive, -10 0
bind = SHIFT, right, moveactive,  10 0
bind = SHIFT, up,    moveactive,  0 -10
bind = SHIFT, down,  moveactive,  0  10
bind = ,    escape, submap, reset
bind = ,    return, submap, reset
submap = reset

submap = windowresize
bind = ,    left,  resizeactive, -30 0
bind = ,    right, resizeactive,  30 0
bind = ,    up,    resizeactive,  0 -30
bind = ,    down,  resizeactive,  0  30
bind = SHIFT, left,  resizeactive, -10 0
bind = SHIFT, right, resizeactive,  10 0
bind = SHIFT, up,    resizeactive,  0 -10
bind = SHIFT, down,  resizeactive,  0  10
bind = ,    escape, submap, reset
bind = ,    return, submap, reset
submap = reset
