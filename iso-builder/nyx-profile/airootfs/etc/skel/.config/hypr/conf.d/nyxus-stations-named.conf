# ============================================================
#  NYXUS — Named stations + station window pins (CURATED — hand-edited)
#  ~/.config/hypr/conf.d/nyxus-stations-named.conf
#
#  WHY THIS IS SEPARATE FROM nyxus-stations.conf
#  --------------------------------------------------------------------
#  nyxus-stations.conf is AUTO-GENERATED. nyxus-hacker-mode rewrites it
#  from scratch on every mode flip, emitting one `workspace =` line per
#  entry in the active stations.json — and its generator only knows how
#  to emit the NUMBERED matrix (ids 1-10).
#
#  HOME, START and LAB had been hand-appended to that generated file, so
#  the first hacker-mode toggle silently deleted all three, along with the
#  Bifrost window pins. Found 2026-07-28: the running session had lost
#  HOME/START/LAB entirely and station 9/10 had reverted to BLAST/EDGE,
#  because the live stations.json predates the Jul 27 rename. Every click
#  on the rail's HOME or START pill went to a workspace Hyprland had never
#  been told about.
#
#  RULE: anything a generator cannot emit belongs HERE, where it cannot be
#  clobbered. Sourced immediately after nyxus-stations.conf.
#
#  © 2026 JOSEPH A. SIERENGOWSKI · NYX-J5W-2026-SIERENGOWSKI-LOCKED
# ============================================================

# ── HOME station (2026-07-26) ─────────────────────────────────────────
# Was `name:0`. Hyprland resolves a numeric `name:0` into the SPECIAL
# workspace range (id -1337) — a hidden overlay — which is why the home
# dashboard was never visible no matter what got drawn on it. A
# non-numeric name keeps it a real, persistent workspace that the left
# rail's HOME pill can switch to normally.
workspace = name:HOME, persistent:true, defaultName:HOME

# ── START station (2026-07-27) ────────────────────────────────────────
# Home of the eww `start-panel` window that replaced the nyxus-start GTK4
# app (which sat on the OVERLAY layer and could be neither closed nor
# moved once it lost keyboard focus). Persistent so the rail can always
# reach it and the panel has a stable station to live on.
workspace = name:START, persistent:true, defaultName:START

# ── LAB station (2026-07-27) ──────────────────────────────────────────
# The home lab: VirtualBox guests, the live attacker view off the
# honeypots, and the tools for working them. NAMED so it costs none of
# the numbered slots 1-10.
workspace = name:LAB, persistent:true, defaultName:LAB

# ── COMPANION ("half") STATIONS 1-10 (2026-07-28) ─────────────────────
# Every numbered station gains a companion reached with Super+Alt+<digit>,
# while Super+<digit> still reaches the primary. The EWW left rail draws
# each one as a small dim ALIEN GLYPH (Tifinagh) tucked under its primary
# number — see the `half_marks` table in stations.json, which is the only
# place those ten labels live.
#
# WHY THEY LIVE HERE AND NOT IN THE MATRIX-GENERATED SHARD
# ---------------------------------------------------------------------
# Hyprland workspace IDs are integers, so a "half" cannot be 1.5 — these
# are NAMED workspaces. nyxus-hacker-mode's generator only knows how to
# emit the numbered matrix (`workspace = <id>, ...`), so a named workspace
# is exactly the kind of thing it would silently delete on the first mode
# flip. That already happened once to HOME/START/LAB. Curated shard it is.
#
# The launch is the companion's own, NOT themed by hacker mode: identity
# and tooling here stay put across a mode flip, which is the whole point of
# a stable second row. Launch strings carry NO COMMAS — Hyprland splits
# workspace rules on commas, so a comma would truncate the rule.
# Every launch is `command -v`-guarded and falls back to something that is
# actually in packages.x86_64 (alacritty / firefox / nmap / cava /
# pavucontrol / htop), so none of them dead-ends on live media where the
# dev-only apps are absent.

# 1 OPS      → ⵀ  logs and journal follow
workspace = name:RELAY, persistent:true, defaultName:RELAY, on-created-empty:sh -c 'exec alacritty --title "NYXUS RELAY" -e sh -c "journalctl -xef 2>/dev/null || exec bash"'
# 2 FORGE    → ⴲ  repo state for the build station
workspace = name:ANVIL, persistent:true, defaultName:ANVIL, on-created-empty:sh -c 'cd "$HOME/Nyxus-Core" 2>/dev/null || cd "$HOME"; exec alacritty --title "NYXUS ANVIL" -e sh -c "command -v git >/dev/null && git status -sb; exec bash"'
# 3 GHOST    → ⵣ  live process/resource watch
workspace = name:TRACE, persistent:true, defaultName:TRACE, on-created-empty:sh -c 'exec alacritty --title "NYXUS TRACE" -e sh -c "command -v btop >/dev/null && exec btop; command -v htop >/dev/null && exec htop; exec top"'
# 4 PULSE    → ⴳ  second reading surface (feeds/boards) away from comms
workspace = name:BEACON, persistent:true, defaultName:BEACON, on-created-empty:sh -c 'command -v firefox >/dev/null && exec firefox --new-window; exec alacritty --title "NYXUS BEACON"'
# 5 WAVE     → ⵙ  levels and routing (WAVE itself is the player)
workspace = name:MIXER, persistent:true, defaultName:MIXER, on-created-empty:sh -c 'command -v pavucontrol >/dev/null && exec pavucontrol; exec alacritty --title "NYXUS MIXER" -e sh -c "command -v alsamixer >/dev/null && exec alsamixer; exec bash"'
# 6 CORE     → ⵍ  keys and archive
workspace = name:VAULT, persistent:true, defaultName:VAULT, on-created-empty:sh -c 'command -v keepassxc >/dev/null && exec keepassxc; command -v thunar >/dev/null && exec thunar "$HOME"; exec alacritty --title "NYXUS VAULT"'
# 7 MESH     → ⴺ  host/route recon next to the NOC
workspace = name:SCAN, persistent:true, defaultName:SCAN, on-created-empty:sh -c 'exec alacritty --title "NYXUS SCAN" -e sh -c "ip -br addr 2>/dev/null; command -v nmap >/dev/null && echo \"nmap ready\"; exec bash"'
# 8 SCRIBE   → ⵋ  tasks board beside the long-form notes
workspace = name:BOARD, persistent:true, defaultName:BOARD, on-created-empty:sh -c 'command -v nyxus-stickies >/dev/null && exec nyxus-stickies; command -v nyxus-notepad >/dev/null && exec nyxus-notepad; exec alacritty --title "NYXUS BOARD"'
# 9 BIFROST  → ⵖ  the guardian's alert feed
workspace = name:SENTRY, persistent:true, defaultName:SENTRY, on-created-empty:sh -c 'exec alacritty --title "NYXUS SENTRY" -e sh -c "journalctl -f -u bifrost -u jett-daemon 2>/dev/null || journalctl -xef 2>/dev/null || exec bash"'
# 10 ARSENAL → ⴼ  drills and trainer next to the consoles
workspace = name:RANGE, persistent:true, defaultName:RANGE, on-created-empty:sh -c 'command -v arsenal >/dev/null && exec alacritty --title "NYXUS RANGE" -e arsenal; exec alacritty --title "NYXUS RANGE"'

# ── Station window pins ───────────────────────────────────────────────
# Bifrost lands on its own station (9) wherever it is launched from.
# nyxus-webapp registers it with WM_CLASS GowskiNetBifrost.
#
# Use the unified `windowrule = <rule>, match:...` form. `windowrulev2` is
# deprecated and raises a config-error banner on the Hyprland the ISO
# actually ships (0.56.x — NEWER than this builder box's 0.55.4, so
# deprecated syntax looks clean here and fails there).
windowrule = workspace 9, match:class ^(GowskiNetBifrost)$
windowrule = workspace 9, match:class ^([Bb]ifrost)$
