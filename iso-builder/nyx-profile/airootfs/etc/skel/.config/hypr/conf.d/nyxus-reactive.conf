# ── THE BUS AND ITS PRODUCERS (added 2026-07-29) ────────────────────────────
# NOTHING STARTED ANY OF THESE. nyxus-sense is the state bus the whole reactive
# layer reads, and no unit, script or exec-once anywhere in the tree ever
# launched it - so on a real boot:
#   * ~/.config/nyxus/sense.json was never written
#   * nyxus-mood never ran, so it never pushed `eww update SENSE=...`
#   * the bars' SENSE defvar sat on its built-in default forever, which is why
#     the mood glow never changed and the wordmark/clock classes were static
#   * nyxus-whispers and nyxus-graffiti-wall polled a file that did not exist
# The consumers were fine. The producer was simply never launched. (Only
# nyxus-pulsed was, via `nyxus-living on quiet` in nyxus-signature.conf.)
#
# Ordering matters: sense publishes, mood and threatd read/derive. The short
# sleeps keep them off the critical path to first paint, and every one of these
# self-guards with a pidfile so a second login cannot double-start them.
exec-once = sh -c 'sleep 3;  command -v nyxus-sense    >/dev/null && nyxus-sense start'
exec-once = sh -c 'sleep 5;  command -v nyxus-mood     >/dev/null && nyxus-mood start'
# Threat signal: turns the REAL security probes into desktop state. Longest
# delay of the three because its first probe round shells out to docker and
# journalctl, and login is already the busiest moment on this system.
exec-once = sh -c 'sleep 12; command -v nyxus-threatd  >/dev/null && nyxus-threatd start'

# Machine Whispers — click-through overlay that drifts glowing fragments of
# the machine's live state across the desktop (audio-reactive).
bind = $mod CTRL, W, exec, nyxus-whispers toggle

# NYXUS SUPERNOVA — beat-locked whole-rig show mode (detonates on the drop).
# (Super+Ctrl+S = poweroff, Super+Alt+S = Wallpaper Studio — so Supernova
# uses Super+Alt+Shift+S to avoid clobbering either.)
bind = $mod ALT SHIFT, S, exec, nyxus-supernova toggle

# Graffiti Memory Wall — accrete your latest activity (git commits, tracks)
# as spray-paint tags onto the alien wall, then set it live.
# (Super+Alt+G = Game mode — so Graffiti uses Super+Alt+Shift+G.)
bind = $mod ALT SHIFT, G, exec, nyxus-graffiti-wall sync
