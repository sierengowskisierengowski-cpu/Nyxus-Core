# Machine Whispers — click-through overlay that drifts glowing fragments of
# the machine's live state across the desktop (audio-reactive).
bind = $mod CTRL, W, exec, ~/.local/bin/nyxus-whispers toggle

# NYXUS SUPERNOVA — beat-locked whole-rig show mode (detonates on the drop).
# (Super+Ctrl+S = poweroff, Super+Alt+S = Wallpaper Studio — so Supernova
# uses Super+Alt+Shift+S to avoid clobbering either.)
bind = $mod ALT SHIFT, S, exec, ~/.local/bin/nyxus-supernova toggle

# Graffiti Memory Wall — accrete your latest activity (git commits, tracks)
# as spray-paint tags onto the alien wall, then set it live.
# (Super+Alt+G = Game mode — so Graffiti uses Super+Alt+Shift+G.)
bind = $mod ALT SHIFT, G, exec, ~/.local/bin/nyxus-graffiti-wall sync
