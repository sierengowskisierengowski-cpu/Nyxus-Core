# NYXUS FX - graffiti tools + wall-fx binds
# ---------------------------------------------------
# (living-wallpaper autostart lives in hyprland.conf line ~45:
#  nyxus-live-wallpaper auto - which also revives nyxus-wall-fx)

# SUPER+G           - spray paint over the screen (nyxus-spray graffiti mode)
# SUPER+SHIFT+P     - toggle wall-fx (audio pulse + per-workspace tints)
bind = SUPER, G, exec, ~/.local/bin/nyxus-spray
bind = SUPER SHIFT, P, exec, sh -c '~/.local/bin/nyxus-wall-fx toggle; notify-send "NYXUS wall-fx" "$(~/.local/bin/nyxus-wall-fx status)"'
