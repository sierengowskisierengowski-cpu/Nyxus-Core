# ============================================================
#  NYXUS — Station Matrix (AUTO-GENERATED by nyxus-hacker-mode)
#  Regenerated on every hacker-mode flip from the active
#  ~/.config/nyxus/stations.json. Do not hand-edit — edit the
#  matrix JSON (stations.json / stations-hacker.json) instead.
# ============================================================

workspace = 1, persistent:true, defaultName:OPS, on-created-empty:sh -c 'command -v arsenal >/dev/null && kitty --title Arsenal -e arsenal || alacritty'
workspace = 2, persistent:true, defaultName:FORGE, on-created-empty:sh -c 'command -v firefox >/dev/null && firefox --new-window http://localhost:5173 || alacritty'
workspace = 3, persistent:true, defaultName:GHOST, on-created-empty:sh -c 'command -v bifrost >/dev/null && (bifrost >/dev/null 2>&1 &); alacritty -e sh -c "journalctl -f -u jett-daemon 2>/dev/null || journalctl -xef"'
workspace = 4, persistent:true, defaultName:PULSE, on-created-empty:sh -c 'command -v meli >/dev/null && (meli >/dev/null 2>&1 &); command -v firefox >/dev/null && firefox --new-window http://localhost:3000 || alacritty'
workspace = 5, persistent:true, defaultName:WAVE, on-created-empty:sh -c 'alacritty -e sh -c "command -v bandwhich >/dev/null && sudo bandwhich || btop"'
workspace = 6, persistent:true, defaultName:CORE, on-created-empty:sh -c '[ -d /opt/arsenal/tools/CIPHER ] && (command -v firefox >/dev/null && firefox --new-window http://localhost:8080 || alacritty) || alacritty -e sh -c "cd /opt/arsenal/tools 2>/dev/null; bash"'
workspace = 7, persistent:true, defaultName:MESH, on-created-empty:sh -c 'alacritty -e sh -c "echo NYXUS GHOST STATUS:; nyxus-ghost status 2>/dev/null; echo; command -v nmap >/dev/null && echo \"nmap ready\"; exec bash"'
workspace = 8, persistent:true, defaultName:SCRIBE, on-created-empty:sh -c 'command -v nyxus-notepad >/dev/null && nyxus-notepad || python3 ~/.nyxus/nyxus_notepad.py'
workspace = 9, persistent:true, defaultName:BLAST, on-created-empty:sh -c 'alacritty -e sh -c "command -v msfconsole >/dev/null && msfconsole || bash"'
workspace = 10, persistent:true, defaultName:EDGE, on-created-empty:sh -c 'alacritty -e sh -c "command -v r2 >/dev/null && echo radare2 ready; exec bash"'

# HOME station (added 2026-07-26). Was `name:0`, which Hyprland resolves into
# the SPECIAL workspace range (id -1337) - a hidden overlay, which is why the
# nyxus-home dashboard was never visible. A non-numeric name keeps it a real,
# persistent workspace that the left rail's HOME pill can switch to normally.
workspace = name:HOME, persistent:true, defaultName:HOME
