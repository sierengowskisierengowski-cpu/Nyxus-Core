# ============================================================
#  NYXUS — Window opacity (DARK MIRROR rev r30 · 2026-05-14)
#  ~/.config/hypr/conf.d/nyxus-hyprland-opacity.conf
#
#  rev r31 · 2026-05-17 — All rules use `windowrulev2`. The v1
#  `windowrule = RULE, class:REGEX` form mis-parses on Hyprland
#  0.50+ ("invalid field class:^...$: missing a value") because
#  `class:` / `title:` matchers are only valid with the v2
#  keyword. The previous comment claiming v2 was deprecated was
#  backwards — v1 is the one that doesn't work with matchers.
#
#  Wiki: https://wiki.hypr.land/Configuring/Window-Rules/
#
#  Uniform 0.92 / 0.78 (focused / unfocused) for ALL NYXUS apps
#  + flyout. Combined with nyxus_chrome.py transparent root +
#  dark-glass panels + Hyprland blur, every app reads as a
#  single piece of dark mirror floating above the wallpaper.
#
#  © 2026 JOSEPH A. SIERENGOWSKI · NYX-J5W-2026-SIERENGOWSKI-LOCKED
# ============================================================

# -- Universal NYXUS class (catch-all) --
windowrule = opacity 0.92 0.78, match:class ^([Nn]yxus.*)$

# -- io.nyxus.* / org.nyxus.* / app.nyxus.* GTK4 app_ids --
# Split into 3 flat rules — nested capture groups with escaped dots
# fail in the Hyprland 0.50+ regex engine.
windowrule = opacity 0.92 0.78, match:class ^io\.nyxus\..*$
windowrule = opacity 0.92 0.78, match:class ^org\.nyxus\..*$
windowrule = opacity 0.92 0.78, match:class ^app\.nyxus\..*$

# -- 11 godsapp-family products + flyout (panel) (`home` excluded) --
windowrule = opacity 0.92 0.78, match:class ^(godsapp|intel|notepad|notes|passwords|phantom|sage|shield|start|store|studio|weather|panel|nyxus-panel)$

# -- Terminals: INVISIBLE (rev r33 · 2026-07-21) --
# The main NYXUS terminals render a 0-opacity background themselves
# (kitty background_opacity 0 / alacritty window.opacity 0), so all you
# see is the text over whatever is behind the window. Pin the Hyprland
# WINDOW opacity to 1.0 so the glyphs stay fully crisp — if we dimmed the
# whole window here, the text would fade too, and idle-glass would make it
# see-through. Frame stripping (no border/shadow/rounding) lives in
# nyxus-hyprland-rules.conf.
windowrule = opacity 1.0 1.0, match:class ^([Kk]itty)$
windowrule = opacity 1.0 1.0, match:class ^([Aa]lacritty)$
windowrule = opacity 1.0 1.0, match:class ^(foot|footclient)$
windowrule = opacity 1.0 1.0, match:class ^(org\.wezfurlong\.wezterm)$
# -- File managers: smoked glass (rev r32 · 2026-07-15) --
windowrule = opacity 0.92 0.80, match:class ^([Tt]hunar)$
windowrule = opacity 0.92 0.80, match:class ^(org\.gnome\.Nautilus)$

# -- Idle screensaver stays fully opaque (rev 2026-07-21) --
# The alien-wallpaper saver is app.nyxus.Screensaver, which the app.nyxus.*
# rule above would otherwise drop to 0.92. Force it solid (last rule wins)
# so the saver is never see-through, including while idle-glass is active.
windowrule = opacity 1.0 1.0, match:class ^(app\.nyxus\.Screensaver)$

# -- Welcome Transmission (rev 2026-07-24) --
# Dedicated Orbitron kitty note. Nyxus.* catch-all above would dim it;
# pin near-solid so the poem stays readable over the wallpaper.
windowrule = opacity 0.96 0.96, match:class ^(nyxus\.welcome-note)$

# -- Tooltips / popovers / dropdowns are layer-shell, not windows; --
# -- their alpha is set inside nyxus_chrome.py CHROME_CSS instead. --
