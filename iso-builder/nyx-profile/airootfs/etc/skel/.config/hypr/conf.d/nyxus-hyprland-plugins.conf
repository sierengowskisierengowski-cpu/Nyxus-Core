# =============================================================================
#  NYXUS · Hyprland plugin shard           rev 2026-05-14 r2 (Sprint F)
#
#  Sourced unconditionally from hyprland.conf. On a freshly-baked ISO
#  before nyxus-hyprpm-plugins.service has built the plugins, the
#  plugin{} blocks below are no-ops (Hyprland silently skips plugin
#  config for unloaded plugins) and the bind to hyprexpo:expo prints
#  a one-time "unknown dispatcher" warning that does NOT crash the
#  session. Once the user-service builds + enables the plugins and
#  triggers `hyprctl reload`, both blocks activate live.
#
#  Trade-off acknowledged: a single warning at first-session start is
#  the cost of zero ISO-side plugin packaging. Alternatives (shipping
#  a .disabled file the script renames; using a dummy dispatcher) all
#  introduced more failure modes than the warning's harm.
#
#  © 2026 JOSEPH SIERENGOWSKI · NYX-J5W-2026-SIERENGOWSKI-LOCKED
# =============================================================================

# ── borders-plus-plus — multi-layer cream halo on focused windows ───────────
plugin {
    borders-plus-plus {
        add_borders         = 1
        col.border_1        = rgba(f4ead52a)
        border_size_1       = 6
        natural_rounding    = yes
    }

    # ── HyprExpo — Mission Control overview ────────────────────────────────
    # Tap binding below = grid view of all workspaces; click a tile to
    # jump there. Backdrop = 53% black so wallpaper reads through.
    hyprexpo {
        columns               = 3
        gap_size              = 8
        bg_col                = rgba(00000088)
        workspace_method      = first 1
        enable_gesture        = true
        gesture_distance      = 300
        gesture_positive      = true
    }
}

# ── HyprExpo keybind — SUPER+ALT+Tab (Sprint F · rev2) ──────────────────────
# Lives in this shard (not main hyprland.conf) so removing the shard
# also removes the bind. Until plugins build, this prints a single
# "unknown dispatcher: hyprexpo:expo" warning at startup, which is
# harmless. After build + reload, it becomes Mission Control.
bind = $mod ALT, Tab, hyprexpo:expo, toggle
