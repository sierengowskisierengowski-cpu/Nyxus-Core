# NYXUS hyprlock accent — auto-managed at runtime by `nyxus-apply-accent` (§3).
#
# These are the PRISM defaults, matching accent.json's active preset. They are
# shipped WITH VALUES, not as an empty stub: hyprlock.conf reads six of these
# variables in sixteen places, and nothing in the session ever invokes
# nyxus-apply-accent, so on a fresh account the stub left every one of them
# undefined. hyprlock then logged sixteen config errors, "proceeded ignoring
# faulty entries", and every colour and shadow that referenced an accent fell
# back to its default — which is why the whole lock screen rendered black with
# no clock, no input field and no art. Measured on the 2026-08-01 ISO.
#
# Keep this file in the exact shape nyxus-apply-accent writes, so the first run
# of the accent engine replaces it cleanly. Keep the legacy _r/_g/_b names —
# older configs source them.
$nyxus_accent_r = 125
$nyxus_accent_g = 61
$nyxus_accent_b = 255
$nyxus_accent_rgba = rgba(125, 61, 255, 1.0)
$nyxus_accent_glow = rgba(125, 61, 255, 0.45)
$nyxus_accent_dim  = rgba(125, 61, 255, 0.75)
$nyxus_accent_faint = rgba(125, 61, 255, 0.20)
$nyxus_accent2_rgba = rgba(255, 45, 173, 1.0)
$nyxus_accent2_glow = rgba(255, 45, 173, 0.45)
$nyxus_accent2_dim  = rgba(255, 45, 173, 0.75)
