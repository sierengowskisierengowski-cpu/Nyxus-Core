# NYXUS · hyprpaper config · rev 2026-05-14 r2 (Sprint F polish)
# Default fallback wallpaper. nyxus-wallpaper-autostart + the
# nyxus-ws-wallpaperd user service handle live rotation/cross-fade
# on top of this static fallback (see hyprland.conf exec-once chain).
# hyprpaper silently no-ops if the path is missing, so the desktop
# always falls through to the swaybg backup in hyprland.conf.

preload  = ~/.config/hypr/walls/nyxus-void-vortex.png
wallpaper = ,~/.config/hypr/walls/nyxus-void-vortex.png

# splash text disabled — NYXUS handles its own boot splash via plymouth.
splash = false
ipc    = on
