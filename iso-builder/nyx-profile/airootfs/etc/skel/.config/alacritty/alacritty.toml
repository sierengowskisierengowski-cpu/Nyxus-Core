[window]
opacity            = 0.88
padding.x          = 16
padding.y          = 12
decorations        = "None"
startup_mode       = "Windowed"
dynamic_title      = true
dynamic_padding    = false

[window.class]
instance = "Alacritty"
general  = "Alacritty"

[scrolling]
history    = 10000
multiplier = 5

[font]
size = 11.5

[font.normal]
family = "JetBrains Mono Nerd Font"
style  = "Regular"

[font.bold]
family = "JetBrains Mono Nerd Font"
style  = "Bold"

[font.italic]
family = "JetBrains Mono Nerd Font"
style  = "Italic"

[font.bold_italic]
family = "JetBrains Mono Nerd Font"
style  = "Bold Italic"

[font.offset]
x = 0
y = 2

[cursor]
style.shape      = "Block"
style.blinking   = "Always"
blink_interval   = 500
unfocused_hollow = true
thickness        = 0.15

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

[mouse]
hide_when_typing = true

[bell]
animation = "EaseOutExpo"
duration  = 0
color     = "#ff4994"

# ── PRISM terminal palette (rev 2026-07-09, HUD-aligned) ────
# Neon-on-void: full 16-color ANSI ramp so syntax highlighting,
# ls, git, htop etc. actually read in color instead of mono cream.
# Alacritty colors must be 6-digit hex — no alpha channel. Window
# translucency lives in window.opacity; "dim" shades are pre-blended
# against the background instead of using an alpha suffix.
[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background     = "#07050e"
foreground     = "#eef2fa"
# was #eef2fa8c (invalid 8-digit hex) — ~55% fg blended over bg
dim_foreground = "#8b93a8"

[colors.cursor]
text   = "#07050e"
cursor = "#ff4994"

[colors.vi_mode_cursor]
text   = "#07050e"
cursor = "#26ff39"

[colors.selection]
text       = "#07050e"
background = "#26ff39"

[colors.search.matches]
foreground = "#07050e"
background = "#ff8b26"

[colors.search.focused_match]
foreground = "#07050e"
background = "#ff4994"

[colors.footer_bar]
background = "#07050e"
# was #eef2fa8c (invalid 8-digit hex)
foreground = "#8b93a8"

[colors.hints.start]
foreground = "#07050e"
background = "#ff4994"

[colors.hints.end]
foreground = "#07050e"
background = "#26ff39"

# ANSI ramp mapped to the HUD neons: pink #ff4994/#ff3cac, green
# #26ff39, orange #ff8b26, gold, cyan #2bd2ff, purple #784bff.
[colors.normal]
black   = "#07050e"
red     = "#ff5470"
green   = "#26ff39"
yellow  = "#ff8b26"
blue    = "#784bff"
magenta = "#ff4994"
cyan    = "#2bd2ff"
white   = "#eef2fa"

[colors.bright]
black   = "#3a4152"
red     = "#ff7a93"
green   = "#7dff8a"
yellow  = "#ffce85"
blue    = "#9d7bff"
magenta = "#ff7ae5"
cyan    = "#66efff"
white   = "#ffffff"

[colors.dim]
black   = "#000000"
red     = "#b23a4f"
green   = "#12a626"
yellow  = "#b37e3b"
blue    = "#52349e"
magenta = "#b23797"
cyan    = "#1b86ad"
white   = "#a6adbd"

[[keyboard.bindings]]
key    = "V"
mods   = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key    = "C"
mods   = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key    = "Plus"
mods   = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key    = "Minus"
mods   = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key    = "Key0"
mods   = "Control"
action = "ResetFontSize"
