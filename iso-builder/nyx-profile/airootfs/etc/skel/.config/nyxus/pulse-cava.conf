# NYXUS PULSE - dedicated cava instance for the audio-reactive prism halo
# (separate from ~/.config/eww/cava.conf so bar visualizer + halo can be
# tuned independently). 2 bars = L/R only; the daemon takes the loudest.
[general]
framerate = 20
bars = 2
autosens = 1
sleep_timer = 2

[input]
method = pulse

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7

[smoothing]
noise_reduction = 55
monstercat = 1
