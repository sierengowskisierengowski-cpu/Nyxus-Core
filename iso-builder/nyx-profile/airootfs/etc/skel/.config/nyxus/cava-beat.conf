# NYXUS · cava config for the beat daemon (NOT the bar visualizer).
# Raw ASCII frames on stdout, 8 bars, 30 fps — nyxus-beatd reads the
# low bars as bass energy for beat detection.
# © 2026 JOSEPH SIERENGOWSKI · NYX-J5W-2026-SIERENGOWSKI-LOCKED
[general]
bars = 8
framerate = 30
autosens = 1


[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
; stereo mirrors the spectrum around the center, which lands the bass
; in bars 4/5 instead of 1/2 where beatd reads it — mono keeps the
; low end in the first bars.
channels = mono
mono_option = average

[smoothing]
noise_reduction = 0.25
