[window]
opacity            = 0.88
padding.x          = 16
padding.y          = 12
decorations        = "None"
startup_mode       = "Windowed"
dynamic_title      = true
dynamic_padding    = false

[window.class]
instance = "Alacritty"
general  = "Alacritty"

[scrolling]
history    = 10000
multiplier = 5

[font]
size = 11.5

[font.normal]
family = "JetBrains Mono Nerd Font"
style  = "Regular"

[font.bold]
family = "JetBrains Mono Nerd Font"
style  = "Bold"

[font.italic]
family = "JetBrains Mono Nerd Font"
style  = "Italic"

[font.bold_italic]
family = "JetBrains Mono Nerd Font"
style  = "Bold Italic"

[font.offset]
x = 0
y = 2

[cursor]
style.shape      = "Block"
style.blinking   = "Always"
blink_interval   = 500
unfocused_hollow = true
thickness        = 0.15

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

[mouse]
hide_when_typing = true

[bell]
animation = "EaseOutExpo"
duration  = 0
color     = "#ff3cac"

# ── PRISM terminal palette (rev 2026-07-06) ─────────────────
# Neon-on-void: full 16-color ANSI ramp so syntax highlighting,
# ls, git, htop etc. actually read in color instead of mono cream.
[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background     = "#05060a"
foreground     = "#eef2fa"
dim_foreground = "#eef2fa8c"

[colors.cursor]
text   = "#05060a"
cursor = "#ff3cac"

[colors.vi_mode_cursor]
text   = "#05060a"
cursor = "#2bd2ff"

[colors.selection]
text       = "#05060a"
background = "#2bd2ff"

[colors.search.matches]
foreground = "#05060a"
background = "#ffb84d"

[colors.search.focused_match]
foreground = "#05060a"
background = "#ff3cac"

[colors.footer_bar]
background = "#05060a"
foreground = "#eef2fa8c"

[colors.hints.start]
foreground = "#05060a"
background = "#ff3cac"

[colors.hints.end]
foreground = "#05060a"
background = "#2bd2ff"

[colors.normal]
black   = "#05060a"
red     = "#ff5470"
green   = "#784bff"
yellow  = "#ffb84d"
blue    = "#4d9fff"
magenta = "#ff3cac"
cyan    = "#2bd2ff"
white   = "#eef2fa"

[colors.bright]
black   = "#3a4152"
red     = "#ff7a93"
green   = "#6dffcf"
yellow  = "#ffce85"
blue    = "#7ab8ff"
magenta = "#ff7ae5"
cyan    = "#66efff"
white   = "#ffffff"

[colors.dim]
black   = "#000000"
red     = "#b23a4f"
green   = "#00b37d"
yellow  = "#b37e3b"
blue    = "#366fb3"
magenta = "#b23797"
cyan    = "#00a0b3"
white   = "#a6adbd"

[[keyboard.bindings]]
key    = "V"
mods   = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key    = "C"
mods   = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key    = "Plus"
mods   = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key    = "Minus"
mods   = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key    = "Key0"
mods   = "Control"
action = "ResetFontSize"
