# ~/.config/nyxus/voice.conf — NYXUS voice control
# Lines are `key = value`. `#` starts a comment. Restart the daemon
# (`nyxus-voice restart`) after editing.

# Wake word. Say "<wake_word>, <command>". Keep it short + distinct.
wake_word = nyxus

# Path to a Vosk model directory. Leave empty to auto-detect a model
# installed by `nyxus-voice-model` under ~/.local/share/nyxus/vosk/.
model = 

# Mic capture. samplerate must match the model (16000 for the small EN
# model). device empty = system default input; otherwise a sounddevice
# index or name substring (see `nyxus-voice calibrate`).
samplerate = 16000
device = 

# STT backend: auto (currently == vosk) | vosk.
backend = auto

# Feedback channel: sound | tts | both | none.
feedback = both

# TTS engine: auto (espeak-ng > espeak > piper) | espeak-ng | espeak | piper | off.
tts = auto
tts_voice = 
tts_rate = 165

# Require the wake word before EVERY command (1 = strongly recommended,
# avoids false triggers). 0 = treat any recognized command as active.
require_wake = 1

# Debounce: ignore the same command repeated within this many ms.
cooldown_ms = 1500
min_command_chars = 2

# Volume step (percent) for "volume up" / "volume down".
volume_step = 5

# Boot into push-to-talk mute (1) or listening (0). Toggle live with
# `nyxus-voice toggle` (or say "Nyxus, go to sleep" / "Nyxus, wake up").
start_muted = 0

# ── App map ────────────────────────────────────────────────────────
# "launch/open/start <alias>" -> command. Add your own; format:
#   app <alias> = <command line>
# e.g.  app spotify = spotify
# The defaults (terminal, files, browser, firefox, code, notes, ...) are
# built in; entries here override or extend them.
# app spotify = spotify
