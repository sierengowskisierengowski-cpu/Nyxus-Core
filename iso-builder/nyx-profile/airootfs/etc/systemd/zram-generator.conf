# NYXUS · zram-generator config · rev 2026-07-14 r2
# Compressed RAM-backed swap. On this 64 GB security-lab box the goal isn't
# "double small RAM" — it's an elastic pressure valve so a CUDA model load +
# 10 Docker honeypots + a kernel compile can't OOM-stall the desktop. zstd
# compresses ~3x at negligible CPU. Cap at 16 GB (compresses to ~5 GB RAM):
# big enough to absorb spikes, small enough it never competes with the work.
# On a <=16 GB machine the min() keeps it at ram/2 so this is safe everywhere.
[zram0]
zram-size = min(ram / 4, 16384)
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
