# NYXUS — SDDM login fix (rev 2026-07-14)
# SDDM's Wayland greeter fails on hybrid NVIDIA hardware
# (HELPER_DISPLAYSERVER_ERROR). X11 greeter is reliable; the user's
# Hyprland session is still pure Wayland.
#
# CRITICAL: the greeter also SIGSEGVs in hardware GL/EGL on hybrid
# Intel+NVIDIA (blank screen + cursor). QT_QUICK_BACKEND=software renders
# the greeter via llvmpipe and sidesteps the GPU. Sessions are unaffected.
[General]
DisplayServer=x11
DefaultSession=nyxus-hyprland.desktop
Numlock=on
GreeterEnvironment=QT_QUICK_BACKEND=software,QT_XCB_GL_INTEGRATION=none

[Users]
RememberLastSession=true
RememberLastUser=true
