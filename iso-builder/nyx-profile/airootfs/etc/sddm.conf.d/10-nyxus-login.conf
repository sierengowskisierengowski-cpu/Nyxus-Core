# NYXUS — SDDM login fix (rev 2026-07-13)
# SDDM's Wayland greeter fails on hybrid NVIDIA hardware
# (HELPER_DISPLAYSERVER_ERROR). X11 greeter is reliable; the user's
# Hyprland session is still pure Wayland.
[General]
DisplayServer=x11
DefaultSession=nyxus-hyprland.desktop
Numlock=on

[Users]
RememberLastSession=true
RememberLastUser=true
