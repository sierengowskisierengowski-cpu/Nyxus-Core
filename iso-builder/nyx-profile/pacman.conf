# pacman.conf used DURING the build (not on the live system).

[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# ── BlackArch repo (rev 2026-07-17) ─────────────────────────────────────
# Supplies the curated offensive/defensive toolkit added to packages.x86_64.
# Signatures are REQUIRED (inherits SigLevel from [options] above): the
# build host has blackarch-keyring installed + populated (blackarch-mirrorlist
# is already present here), so pacstrap verifies these at bake exactly like
# the official repos. The Include path resolves against the build host's
# /etc/pacman.d/blackarch-mirrorlist (shipped by the blackarch-mirrorlist
# package). customize_airootfs.sh mirrors this repo block + populates the
# keyring inside the LIVE system so post-boot `pacman -S` / nyxus-blackarch-full
# keep verifying. Listed AFTER the official repos so official packages win
# a same-name tie (blackarch only supplies names not already in core/extra).
[blackarch]
Include = /etc/pacman.d/blackarch-mirrorlist
