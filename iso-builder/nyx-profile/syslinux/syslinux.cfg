#
# This file is the STOCK-KERNEL fallback menu. When NYX_WITH_KAGE_RYU=1 (the
# default) build-iso.sh overwrites it in the throwaway profile copy with the
# Kage-Ryu menu; keep the two in sync.
#
# `UI` is mandatory. Without it syslinux ignores every MENU directive and
# renders no menu at all — the 2026.07.31 ISO shipped three MENU LABEL entries
# that a BIOS user could never see or select, so the safe/no-KMS path was
# unreachable. mkarchiso installs every /usr/lib/syslinux/bios/*.c32 into the
# ISO, so vesamenu.c32 and its libcom32/libutil dependencies are always there.

UI vesamenu.c32
DEFAULT nyx
TIMEOUT 100
TOTALTIMEOUT 0

MENU TITLE NYXUS  ·  ALIEN NEON
MENU MARGIN 8
MENU ROWS 6
MENU TABMSGROW 14
MENU HELPMSGROW 16
MENU TIMEOUTROW 18
MENU VSHIFT 6

# ALIEN NEON: violet #7d3dff selection, cool-white #eef2fa text, void ground.
MENU COLOR title        1;36;44  #ff7d3dff  #00000000  none
MENU COLOR sel          7;37;40  #ff05060a  #ff7d3dff  none
MENU COLOR unsel        37;44    #ffeef2fa  #00000000  none
MENU COLOR border       30;44    #ff7d3dff  #00000000  none
MENU COLOR help         37;40    #ff9aa0ad  #00000000  none
MENU COLOR timeout_msg  37;40    #ff9aa0ad  #00000000  none
MENU COLOR timeout      1;37;40  #ffff2dad  #00000000  none
MENU COLOR msg07        37;40    #ffeef2fa  #00000000  none
MENU COLOR tabmsg       31;40    #ff9aa0ad  #00000000  none

# cow_spacesize — see B-06 / FS-01 in docs/ISO_FULL_AUDIT_2026-07-31.md.
# archiso defaults the live overlay tmpfs to 256M. /etc/skel alone is ~162 MB
# and lands in /home/nyx at first login, so the shipped image hit 100% full
# roughly four minutes into the first session and every launch after that ran
# against a full disk. A percentage scales with the machine instead of pinning
# a size that is wrong on both small and large boxes; tmpfs allocates lazily,
# so this reserves nothing up front.
LABEL nyx
    MENU LABEL Boot ^NYXUS (live)
    MENU DEFAULT
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=50% quiet splash

LABEL nyx_safe
    MENU LABEL Boot NYXUS (^safe / no KMS)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=50% nomodeset

LABEL nyx_copytoram
    MENU LABEL Boot NYXUS (copy to ^RAM — unplug the stick after boot)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=50% copytoram quiet splash

LABEL reboot
    MENU LABEL ^Reboot
    COM32 reboot.c32

LABEL poweroff
    MENU LABEL ^Power off
    COM32 poweroff.c32
