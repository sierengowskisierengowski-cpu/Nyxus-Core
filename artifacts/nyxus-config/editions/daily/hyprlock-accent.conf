# NYXUS hyprlock accent — URBAN NEON (Daily Driver edition).
#
# Staged over ~/.config/hypr/hyprlock-accent.conf ONLY when the bake runs with
# NYX_EDITION=daily. The shared/alien shard keeps its PRISM values and is not
# touched, so the alien lock screen is unchanged.
#
# These are the values `nyxus-apply-accent urban-neon` would generate from
# editions/daily/accent.json (primary #2ee6d6 = 46,230,214; secondary #ff9d2e =
# 255,157,46), written in the exact shape that script's §3 emits so its first
# run replaces this file cleanly.
#
# Ship it WITH VALUES, never as a stub. hyprlock.conf reads six of these
# variables in sixteen places and nothing in the session ever invokes
# nyxus-apply-accent, so an empty shard leaves every one of them undefined:
# measured on the 2026-08-01 ISO, hyprlock logged sixteen config errors,
# "proceeded ignoring faulty entries", and every colour and shadow that named
# an accent fell back to its default — which is a black lock screen with no
# clock, no input field and no art (audit §11.5 LK-01). Keep the legacy
# _r/_g/_b names; older configs source them.
$nyxus_accent_r = 46
$nyxus_accent_g = 230
$nyxus_accent_b = 214
$nyxus_accent_rgba = rgba(46, 230, 214, 1.0)
$nyxus_accent_glow = rgba(46, 230, 214, 0.45)
$nyxus_accent_dim  = rgba(46, 230, 214, 0.75)
$nyxus_accent_faint = rgba(46, 230, 214, 0.20)
$nyxus_accent2_rgba = rgba(255, 157, 46, 1.0)
$nyxus_accent2_glow = rgba(255, 157, 46, 0.45)
$nyxus_accent2_dim  = rgba(255, 157, 46, 0.75)
