[window]
opacity            = 0.88
padding.x          = 16
padding.y          = 12
decorations        = "None"
startup_mode       = "Windowed"
dynamic_title      = true
dynamic_padding    = false

[window.class]
instance = "Alacritty"
general  = "Alacritty"

[scrolling]
history    = 10000
multiplier = 5

[font]
size = 11.5

[font.normal]
family = "JetBrains Mono Nerd Font"
style  = "Regular"

[font.bold]
family = "JetBrains Mono Nerd Font"
style  = "Bold"

[font.italic]
family = "JetBrains Mono Nerd Font"
style  = "Italic"

[font.bold_italic]
family = "JetBrains Mono Nerd Font"
style  = "Bold Italic"

[font.offset]
x = 0
y = 2

[cursor]
style.shape      = "Block"
style.blinking   = "Always"
blink_interval   = 500
unfocused_hollow = true
thickness        = 0.15

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

[mouse]
hide_when_typing = true

[bell]
animation = "EaseOutExpo"
duration  = 0
color     = "#ff8a1e"

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background     = "#05060a"
foreground     = "#eef2fa"
dim_foreground = "0x8CEEF2FA"

[colors.cursor]
text   = "#05060a"
cursor = "#7d3dff"

[colors.vi_mode_cursor]
text   = "#05060a"
cursor = "#ff2dad"

[colors.selection]
text       = "#05060a"
background = "#ff2dad"

[colors.search.matches]
foreground = "#05060a"
background = "#ffe600"

[colors.search.focused_match]
foreground = "#05060a"
background = "#ff8a1e"

[colors.footer_bar]
background = "#05060a"
foreground = "0x8CEEF2FA"

[colors.hints.start]
foreground = "#05060a"
background = "#ffe600"

[colors.hints.end]
foreground = "#05060a"
background = "#ff8a1e"

[colors.normal]
black   = "#05060a"
red     = "#ff2d55"
green   = "#39ff14"
yellow  = "#ffe600"
blue    = "#4d9fff"
magenta = "#ff2dad"
cyan    = "#2bd2ff"
white   = "#eef2fa"

[colors.bright]
black   = "#3a4152"
red     = "#ff5470"
green   = "#7dff5e"
yellow  = "#fff26b"
blue    = "#7ab8ff"
magenta = "#ff7ae5"
cyan    = "#66efff"
white   = "#ffffff"

[colors.dim]
black   = "#000000"
red     = "#b3203c"
green   = "#28b30e"
yellow  = "#b3a100"
blue    = "#366fb3"
magenta = "#b32079"
cyan    = "#1e93b3"
white   = "#a6a9af"

[[keyboard.bindings]]
key    = "V"
mods   = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key    = "C"
mods   = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key    = "Plus"
mods   = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key    = "Minus"
mods   = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key    = "Key0"
mods   = "Control"
action = "ResetFontSize"
