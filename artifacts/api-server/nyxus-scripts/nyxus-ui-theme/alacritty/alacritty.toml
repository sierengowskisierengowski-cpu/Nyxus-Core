#  Canonical palette: violet #7d3dff · magenta #ff2dad · green #39ff14 ·
#  orange #ff8a1e · cyan #2bd2ff · red #ff2d55 · yellow #ffe600
#  Default text is cool white #eef2fa on void — colors appear only where
#  programs actually emit ANSI color. Mirrors kitty.conf — keep in lockstep.
