# ============================================================
#  NYXUS — Aurora Pack (rev r1 · 2026-07-20)
#  ~/.config/hypr/conf.d/nyxus-hyprland-aurora.conf
#
#  Pure-compositor eye candy — no plugins, no new daemons,
#  nothing to break on a Hyprland update:
#
#    1. X-RAY PEEK       — Super+D fades the whole window stack
#                          to glass so the living wallpaper shows
#                          through; Super+D again restores
#    2. NEON EYEDROPPER  — Super+I zooms in on any pixel and
#                          copies its hex to the clipboard
#    3. BOOMERANG        — tap the workspace key you're already
#                          on to bounce back to the previous one
#                          (Super+' also jumps to previous)
#    4. SCRATCHPAD FROST — the Super+S scratchpad backdrop gets
#                          the full Dual-Kawase frost treatment
#    5. FULLSCREEN GRACE — a new tiled window can break a
#                          fullscreen app out of fullscreen
#                          instead of spawning hidden behind it
#
#  ── REVERT IF YOU HATE IT ─────────────────────────────────
#    rm ~/.config/hypr/conf.d/nyxus-hyprland-aurora.conf
#    hyprctl reload
#
#  © 2026 JOSEPH A. SIERENGOWSKI · NYX-J5W-2026-SIERENGOWSKI-LOCKED
# ============================================================

# ── 1 · X-RAY PEEK ─────────────────────────────────────────────────────
# Super+D drops every window to near-glass and kills the frost so the
# wallpaper (still or living) reads at full strength — desk-check the
# alien art without touching a single window. Super+D again runs
# `hyprctl reload`, the same revert path every NYXUS shard documents,
# so the exact config-file values come back. State rides a runtime
# flag file, so a reboot always starts un-peeked.
bind = $mod, D, exec, sh -c 'f="${XDG_RUNTIME_DIR:-/tmp}/nyxus-peek.state"; if [ -f "$f" ]; then rm -f "$f"; hyprctl reload >/dev/null 2>&1; else touch "$f"; hyprctl --batch "keyword decoration:active_opacity 0.15;keyword decoration:inactive_opacity 0.10;keyword decoration:dim_inactive false;keyword decoration:blur:enabled false" >/dev/null 2>&1; fi'

# ── 2 · NEON EYEDROPPER ────────────────────────────────────────────────
# Super+I: hyprpicker magnifies under the cursor; click any pixel and
# the hex lands on the clipboard with a toast. Fails soft with a toast
# if hyprpicker is somehow missing (e.g. lean rebuild without it).
bind = $mod, I, exec, sh -c 'if command -v hyprpicker >/dev/null 2>&1; then c=$(hyprpicker -a 2>/dev/null); [ -n "$c" ] && notify-send "NYXUS Eyedropper" "copied $c"; else notify-send -u low "NYXUS Eyedropper" "hyprpicker is not installed"; fi'

# ── 3 · BOOMERANG WORKSPACES ───────────────────────────────────────────
# Tap Super+3 while already on 3 → snap back to wherever you came from.
# allow_workspace_cycles keeps the previous-chain alive so Super+'
# ping-pongs between your two hot stations.
binds {
    workspace_back_and_forth = true
    allow_workspace_cycles   = true
}
bind = $mod, apostrophe, workspace, previous

# ── 4 · SCRATCHPAD FROST ───────────────────────────────────────────────
# Blur what's behind special-workspace windows too — the Super+S magic
# scratchpad now floats on the same deep frosted glass as everything
# else instead of a flat dim.
decoration {
    blur {
        special = true
    }
}

# ── 5 · FULLSCREEN GRACE ───────────────────────────────────────────────
# Use Hyprland's real fullscreen-focus behavior: when a new tiled window
# requests focus over a fullscreen app, mode 2 exits fullscreen so the
# new window is visible instead of hiding behind it.
misc {
    on_focus_under_fullscreen = 2  # 2 = exit fullscreen when a new tiled window takes focus
}
