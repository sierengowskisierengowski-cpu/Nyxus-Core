# ============================================================
#  NYXUS — Named stations + station window pins (CURATED — hand-edited)
#  ~/.config/hypr/conf.d/nyxus-stations-named.conf
#
#  WHY THIS IS SEPARATE FROM nyxus-stations.conf
#  --------------------------------------------------------------------
#  nyxus-stations.conf is AUTO-GENERATED. nyxus-hacker-mode rewrites it
#  from scratch on every mode flip, emitting one `workspace =` line per
#  entry in the active stations.json — and its generator only knows how
#  to emit the NUMBERED matrix (ids 1-10).
#
#  HOME, START and LAB had been hand-appended to that generated file, so
#  the first hacker-mode toggle silently deleted all three, along with the
#  Bifrost window pins. Found 2026-07-28: the running session had lost
#  HOME/START/LAB entirely and station 9/10 had reverted to BLAST/EDGE,
#  because the live stations.json predates the Jul 27 rename. Every click
#  on the rail's HOME or START pill went to a workspace Hyprland had never
#  been told about.
#
#  RULE: anything a generator cannot emit belongs HERE, where it cannot be
#  clobbered. Sourced immediately after nyxus-stations.conf.
#
#  © 2026 JOSEPH A. SIERENGOWSKI · NYX-J5W-2026-SIERENGOWSKI-LOCKED
# ============================================================

# ── HOME station (2026-07-26) ─────────────────────────────────────────
# Was `name:0`. Hyprland resolves a numeric `name:0` into the SPECIAL
# workspace range (id -1337) — a hidden overlay — which is why the home
# dashboard was never visible no matter what got drawn on it. A
# non-numeric name keeps it a real, persistent workspace that the left
# rail's HOME pill can switch to normally.
workspace = name:HOME, persistent:true, defaultName:HOME

# ── START station (2026-07-27) ────────────────────────────────────────
# Home of the eww `start-panel` window that replaced the nyxus-start GTK4
# app (which sat on the OVERLAY layer and could be neither closed nor
# moved once it lost keyboard focus). Persistent so the rail can always
# reach it and the panel has a stable station to live on.
workspace = name:START, persistent:true, defaultName:START

# ── LAB station (2026-07-27) ──────────────────────────────────────────
# The home lab: VirtualBox guests, the live attacker view off the
# honeypots, and the tools for working them. NAMED so it costs none of
# the numbered slots 1-10.
workspace = name:LAB, persistent:true, defaultName:LAB

# ── Station window pins ───────────────────────────────────────────────
# Bifrost lands on its own station (9) wherever it is launched from.
# nyxus-webapp registers it with WM_CLASS GowskiNetBifrost.
#
# Use the unified `windowrule = <rule>, match:...` form. `windowrulev2` is
# deprecated and raises a config-error banner on the Hyprland the ISO
# actually ships (0.56.x — NEWER than this builder box's 0.55.4, so
# deprecated syntax looks clean here and fails there).
windowrule = workspace 9, match:class ^(GowskiNetBifrost)$
windowrule = workspace 9, match:class ^([Bb]ifrost)$
