# ============================================================
#  NYXUS — kitty (the main terminal, Super+Return)
#  INVISIBLE MODE: background_opacity 0 → the background is fully
#  transparent so all you see is the text floating over whatever is
#  behind the window (desktop / living wallpaper / other windows).
#  kitty keeps the glyphs fully opaque, so text stays crisp.
#  Raise background_opacity toward 1.0 if it's too hard to read on a
#  busy wallpaper (0.0 = fully invisible, 1.0 = solid).
#  © 2026 JOSEPH A. SIERENGOWSKI · NYX-J5W-2026-SIERENGOWSKI-LOCKED
# ============================================================

# ── invisible background ────────────────────────────────────────────
background                #0a0a14
background_opacity        0.0
dynamic_background_opacity yes

# The window frame is owned by Hyprland; a windowrule strips the border,
# shadow and rounding for terminals (see hyprland.conf) so there is
# literally nothing on screen but the text.
hide_window_decorations   yes
window_padding_width      10
confirm_os_window_close   0

# ── NYXUS type ──────────────────────────────────────────────────────
font_family               JetBrains Mono Nerd Font
bold_font                 JetBrains Mono Nerd Font Bold
italic_font               JetBrains Mono Nerd Font Italic
font_size                 11.5
cursor_shape              block
cursor_blink_interval     0.5
scrollback_lines          10000
enable_audio_bell         no

# ── NYXUS palette (tan accent over ink) ─────────────────────────────
foreground                #f4ead5
cursor                    #f4ead5
selection_background      #f4ead5
selection_foreground      #050308
url_color                 #8a857e
