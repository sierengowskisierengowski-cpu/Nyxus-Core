# ════════════════════════════════════════════════════════════════════
# nyxus-voice.conf — Hyprland include for NYXUS voice control
# rev 2026-07-14 r1 (Cosmic Voice Control)
#
# This is a DEDICATED, self-contained Hyprland include so that voice
# control can be wired in WITHOUT touching the main hyprland.conf
# autostart block. To enable it, add ONE line to ~/.config/hypr/hyprland.conf
# (anywhere near the other `source =` lines):
#
#     source = ~/.config/hypr/nyxus-voice.conf
#
# and copy this file to ~/.config/hypr/nyxus-voice.conf. The
# `nyxus-voice-install` helper does both for you.
#
# The daemon is SAFE to autostart even with no STT backend installed:
# it logs "no STT backend; install vosk model" and idles. It never
# blocks login and never crashes the session.
# ════════════════════════════════════════════════════════════════════

# Start the wake-word listener after the desktop settles. PATH is
# prepended inside the exec so ~/.local/bin resolves under greetd/DM
# launches (see the hyprland.conf autostart comments for why). The
# nyxus-wait-bootstrap gate keeps it from racing a half-installed
# first-boot; the `|| true` guarantees a missing binary never errors
# the session.
exec-once = sh -c 'export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"; command -v nyxus-wait-bootstrap >/dev/null && exec nyxus-wait-bootstrap sh -c "sleep 10; nyxus-voice start" || (sleep 10; nyxus-voice start) || true'

# ── Optional keybinds ────────────────────────────────────────────────
# Uncomment to bind push-to-talk mute toggle + a quick status toast.
# $mod+Alt+K chosen because it's unbound in the NYXUS keymap (Super+Alt+L
# = living theme, Super+Alt+V = live wallpaper, Super+Alt+B = beat).
#
# bind = $mod ALT, K, exec, nyxus-voice toggle
# bind = $mod SHIFT ALT, K, exec, notify-send "◤ NYXUS ◥ VOICE" "$(nyxus-voice status)"
