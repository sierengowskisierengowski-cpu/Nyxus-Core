# ============================================================
#  NYXUS — Station Matrix (AUTO-GENERATED by nyxus-hacker-mode)
#  Regenerated on every hacker-mode flip from the active
#  ~/.config/nyxus/stations.json. Do not hand-edit — edit the
#  matrix JSON (stations.json / stations-hacker.json) instead.
#
#  NUMBERED stations only (1-10). Named stations (HOME/START/LAB) and the
#  station window pins live in nyxus-stations-named.conf, which this
#  generator never touches — hand-appending them here got them deleted on
#  the first mode flip (2026-07-28).
# ============================================================

workspace = 1, persistent:true, defaultName:OPS, on-created-empty:alacritty
workspace = 2, persistent:true, defaultName:FORGE, on-created-empty:sh -c 'command -v code >/dev/null && exec code; exec alacritty'
workspace = 3, persistent:true, defaultName:GHOST, on-created-empty:sh -c 'command -v nyxus-security >/dev/null && nyxus-security || alacritty -e btop'
workspace = 4, persistent:true, defaultName:PULSE, on-created-empty:firefox
workspace = 5, persistent:true, defaultName:WAVE, on-created-empty:sh -c 'command -v audacious >/dev/null && exec audacious; command -v cava >/dev/null && exec alacritty --title "NYXUS WAVE" -e cava; command -v pavucontrol >/dev/null && exec pavucontrol; exec alacritty'
workspace = 6, persistent:true, defaultName:CORE, on-created-empty:sh -c 'command -v nautilus >/dev/null && exec nautilus; command -v nyxus-files >/dev/null && exec nyxus-files; exec alacritty'
workspace = 7, persistent:true, defaultName:MESH, on-created-empty:sh -c 'alacritty --title "GowskiNet NOC" -e sh -c "command -v sharknoc >/dev/null && exec sharknoc --watch || exec btop"'
workspace = 8, persistent:true, defaultName:SCRIBE, on-created-empty:sh -c 'command -v nyxus-notepad >/dev/null && nyxus-notepad || python3 ~/.nyxus/nyxus_notepad.py'
workspace = 9, persistent:true, defaultName:BIFROST, on-created-empty:nyxus-webapp bifrost
workspace = 10, persistent:true, defaultName:ARSENAL, on-created-empty:nyxus-consoles
