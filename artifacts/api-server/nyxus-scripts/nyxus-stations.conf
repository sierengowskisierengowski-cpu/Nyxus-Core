# ============================================================
#  NYXUS — Station Matrix (rev 2026-07-15 · reconciled + wired)
#  ~/.config/hypr/conf.d/nyxus-stations.conf
#
#  SINGLE SOURCE OF TRUTH for workspace 1-10 identity. Sourced from
#  hyprland.conf right after nyxus-hyprland-general.conf. Matches
#  ~/.config/nyxus/stations.json and the EWW left rail exactly — the
#  old WEB/CODE/TERM/… names in general.conf were removed to end the
#  split-brain (bar said OPS, Hyprland said WEB).
#
#  HOME (workspace name:0) is the standalone nyxus-home dashboard and
#  is defined in the main hyprland.conf — it stays outside 1-10.
#
#  ── AUTO-LAUNCH POLICY ───────────────────────────────────────────────
#  `on-created-empty` fires when a persistent workspace is first created
#  empty — i.e. once at login. We keep the login footprint small and
#  "daily-driver ready": a terminal (OPS), a browser (PULSE) and the file
#  manager (CORE) come up automatically. Every other station documents
#  its signature app on a commented `on-created-empty` line — uncomment
#  to opt in (be aware each one adds an app to your login).
#
#  © 2026 JOSEPH SIERENGOWSKI · NYX-J5W-2026-SIERENGOWSKI-LOCKED
# ============================================================

# ── STATION 1 · OPS — Command · Terminal · Control ───────────────────
workspace = 1, persistent:true, defaultName:OPS, on-created-empty:alacritty

# ── STATION 2 · FORGE — Build · Code · Ship ──────────────────────────
workspace = 2, persistent:true, defaultName:FORGE
# on-created-empty:sh -c 'command -v cursor >/dev/null && cursor || code'

# ── STATION 3 · GHOST — Security · Intel · Recon ─────────────────────
workspace = 3, persistent:true, defaultName:GHOST
# on-created-empty:sh -c 'command -v nyxus-security >/dev/null && nyxus-security || alacritty -e btop'

# ── STATION 4 · PULSE — Comms · Signal · Chat ────────────────────────
workspace = 4, persistent:true, defaultName:PULSE, on-created-empty:firefox

# ── STATION 5 · WAVE — Media · Sound · Stream ────────────────────────
workspace = 5, persistent:true, defaultName:WAVE
# on-created-empty:sh -c 'command -v spotify >/dev/null && spotify || firefox --new-window https://music.youtube.com'

# ── STATION 6 · CORE — Files · Data · Vault ──────────────────────────
workspace = 6, persistent:true, defaultName:CORE, on-created-empty:thunar

# ── STATION 7 · MESH — Network · NOC · Mesh ──────────────────────────
workspace = 7, persistent:true, defaultName:MESH
# on-created-empty:sh -c 'command -v nyxus-sysmon >/dev/null && nyxus-sysmon || python3 ~/.nyxus/nyxus_sysmon_gtk.py'

# ── STATION 8 · SCRIBE — Notes · Docs · Scribe ───────────────────────
workspace = 8, persistent:true, defaultName:SCRIBE
# on-created-empty:sh -c 'command -v nyxus-notepad >/dev/null && nyxus-notepad || python3 ~/.nyxus/nyxus_notepad.py'

# ── STATION 9 · BLAST — Games · Arena · Blast ────────────────────────
workspace = 9, persistent:true, defaultName:BLAST

# ── STATION 10 · EDGE — Lab · Edge · Experimental ────────────────────
#  RESERVED as the landing pad for the forthcoming "NYXUS master hub"
#  (Bifrost). `bifrost` is currently a shell alias, not a binary on PATH,
#  and the build under ~/Projects/bifrost is still in progress, so the
#  auto-launch is left COMMENTED until the user confirms the final launch
#  command. Uncomment (and adjust the path if the build moves) to wire it:
workspace = 10, persistent:true, defaultName:EDGE
# on-created-empty:sh -c 'B="$HOME/Projects/bifrost/app/bifrost-desktop/src-tauri/target/release/bifrost"; [ -x "$B" ] && BIFROST_GUARDIAN="$HOME/Projects/bifrost/bifrost/guardian.py" "$B" || true'
