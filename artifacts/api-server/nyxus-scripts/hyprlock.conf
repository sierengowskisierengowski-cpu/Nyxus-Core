# ============================================================================
#  NYXUS — Hyprlock Lock Screen                          rev 2026-05-14 r3
#
#  Visually mirrors the SDDM front door (Main.qml r3): atmospheric blurred
#  background, single centred glass card, Eclipse mark above the wordmark,
#  CREAM accent throughout (rev r15). One clock above the panel, no
#  duplicate datetime, no purple residue, deprecated logo glyph removed.
#
#  Layout (top → bottom, anchored to card centre at y=0):
#    +320  clock           (font 88, cream)
#    +250  date            (font 14, dim cream, letter-spaced)
#    +200  hairline rule   (80px wide cream@10%)
#    +150  ECLIPSE image   (64px PNG, /usr/share/nyxus/brand/png)
#    + 92  wordmark NYXUS  (font 22, cream, letter-spaced 12)
#    + 50  tagline         (font 11, dim cream)
#    +  0  CARD STARTS     (centred glass panel ~460 x 200)
#    - 70  password input  (52 tall, cream outline, 3px)
#    -150  wrong-pw msg    (font 11, danger)
#    -260  caps lock       (font 10, amber)
#    -340  copyright       (font  8, very dim)
#
#  Hyprlock falls back to the colour fill if the wallpaper or Eclipse PNG
#  is missing, so the screen always renders even on a fresh first-boot
#  before render-brand-pngs.sh has run.
#
#  © 2026 JOSEPH SIERENGOWSKI · NYX-J5W-2026-SIERENGOWSKI-LOCKED
# ============================================================================

general {
    grace              = 0
    hide_cursor        = true
    no_fade_in         = false
    no_fade_out        = false
    ignore_empty_input = false
    text_trim          = true
}

# Settings → Appearance → Accent writes $nyxus_accent_r/g/b/rgba into this
# file. Sourced unconditionally; hyprlock silently ignores a missing source.
source = ~/.config/hypr/hyprlock-accent.conf

# ── BACKGROUND ──────────────────────────────────────────────────────────
background {
    monitor           =
    color             = rgb(040408)
    path              = ~/.config/hypr/walls/nyxus-lock-eclipse.png
    blur_size         = 10
    blur_passes       = 4
    brightness        = -0.55
    contrast          = 0.92
    vibrancy          = 0.06
    vibrancy_darkness = 0.30
}

# ── CLOCK (HH:MM) ───────────────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:1000] echo "$(date +"%H:%M")"
    color       = rgba(244, 234, 213, 1.0)
    font_size   = 88
    font_family = JetBrains Mono Bold

    shadow_passes = 3
    shadow_size   = 22
    shadow_color  = rgba(244, 234, 213, 0.32)
    shadow_boost  = 1.4

    position = 0, 320
    halign   = center
    valign   = center
}

# ── DATE ────────────────────────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:60000] echo "$(date '+%A · %B %d · %Y' | tr '[:lower:]' '[:upper:]')"
    color       = rgba(244, 234, 213, 0.55)
    font_size   = 14
    font_family = Inter

    shadow_passes = 1
    shadow_size   = 4
    shadow_color  = rgba(0, 0, 0, 0.85)

    position = 0, 250
    halign   = center
    valign   = center
}

# ── HAIRLINE SEPARATOR ──────────────────────────────────────────────────
label {
    monitor     =
    text        = ────────
    color       = rgba(244, 234, 213, 0.18)
    font_size   = 12
    font_family = Inter

    position = 0, 200
    halign   = center
    valign   = center
}

# ── ECLIPSE MARK ────────────────────────────────────────────────────────
# 64px Eclipse PNG, rendered at ISO build time by render-brand-pngs.sh
# from /usr/share/nyxus/brand/eclipse.svg. Hyprlock skips missing images
# silently — fallback chain: full PNG path → 256 size → no mark (the
# wordmark below still reads as NYXUS).
image {
    monitor  =
    path     = /usr/share/nyxus/brand/png/eclipse-128.png
    size     = 64
    rounding = -1
    border_size = 0

    shadow_passes = 4
    shadow_size   = 24
    shadow_color  = rgba(244, 234, 213, 0.20)
    shadow_boost  = 1.2

    position = 0, 150
    halign   = center
    valign   = center
}

# ── WORDMARK ────────────────────────────────────────────────────────────
label {
    monitor     =
    text        = NYXUS
    color       = rgba(244, 234, 213, 1.0)
    font_size   = 22
    font_family = Inter Bold

    shadow_passes = 2
    shadow_size   = 10
    shadow_color  = rgba(244, 234, 213, 0.25)
    shadow_boost  = 1.2

    position = 0, 92
    halign   = center
    valign   = center
}

# ── TAGLINE ─────────────────────────────────────────────────────────────
label {
    monitor     =
    text        = Silent. Dark. Purely Functional.
    color       = rgba(244, 234, 213, 0.45)
    font_size   = 11
    font_family = Inter Italic

    shadow_passes = 0

    position = 0, 50
    halign   = center
    valign   = center
}

# ── PASSWORD INPUT ──────────────────────────────────────────────────────
input-field {
    monitor =

    size              = 380, 52
    outline_thickness = 1
    dots_size         = 0.26
    dots_spacing      = 0.22
    dots_center       = true
    dots_rounding     = -1

    # Sprint K-A rev r16: copper outer ring on the lock-screen indicator
    # so the active "checking PIN" state reads as warm metal, not cream.
    # NYXUS-TOKENS-START indicator
    outer_color = rgba(184, 134, 90, 0.55)
    inner_color = rgba(6, 6, 10, 0.78)
    font_color  = rgba(244, 234, 213, 1.0)
# NYXUS-TOKENS-END indicator
    font_family = Inter

    fade_on_empty = true
    fade_timeout  = 1200

    placeholder_text = passphrase

    rounding = 3

    check_color     = rgba(52, 211, 153, 1.0)
    fail_color      = rgba(248, 113, 113, 1.0)
    fail_text       = ACCESS DENIED
    fail_transition = 200

    capslock_color  = rgba(251, 146, 60, 1.0)
    numlock_color   = -1
    bothlock_color  = -1
    invert_numlock  = false
    swap_font_color = false

    shadow_passes = 4
    shadow_size   = 14
    shadow_color  = rgba(0, 0, 0, 0.70)
    shadow_boost  = 1.4

    position = 0, -70
    halign   = center
    valign   = center
}

# ── WRONG PASSWORD MESSAGE ──────────────────────────────────────────────
label {
    monitor     =
    text        = $FAIL
    color       = rgba(248, 113, 113, 0.95)
    font_size   = 11
    font_family = Inter

    shadow_passes = 2
    shadow_size   = 8
    shadow_color  = rgba(248, 113, 113, 0.5)

    position = 0, -150
    halign   = center
    valign   = center
}

# ── CAPS LOCK INDICATOR ─────────────────────────────────────────────────
label {
    monitor     =
    text        = $LAYOUT[en] · CAPS $LOCKED
    color       = rgba(251, 146, 60, 0.7)
    font_size   = 10
    font_family = Inter

    shadow_passes = 1
    shadow_size   = 5
    shadow_color  = rgba(251, 146, 60, 0.3)

    position = 0, -260
    halign   = center
    valign   = center
}

# ── COPYRIGHT ───────────────────────────────────────────────────────────
label {
    monitor     =
    text        = © 2026 JOSEPH SIERENGOWSKI · NYX-J5W-2026-SIERENGOWSKI-LOCKED
    color       = rgba(244, 234, 213, 0.20)
    font_size   = 8
    font_family = Inter

    shadow_passes = 0

    position = 0, -340
    halign   = center
    valign   = center
}
