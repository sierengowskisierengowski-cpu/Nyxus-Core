# NYXUS monitor overrides — auto-managed by Settings (Displays).
#
# This file ships empty. Settings rewrites it at runtime with the user's
# monitor layout (resolution / refresh / scale / position / transform).
# It exists so hyprland.conf's `source = ./nyxus-monitors.conf` resolves on a
# fresh account instead of throwing "source= globbing error: found no match".
#
# Do NOT hand-edit — use Settings ▸ Displays. Example of a generated line:
#   monitor = DP-1, 2560x1440@144, 0x0, 1
