# ~/.config/hypr/conf.d/nyxus-browser-blur.conf
# NYXUS Sprint K-D rev r16 — Browser windowrules (locked, 2026-05-14)
#
# Forces every Chromium-family browser AND Firefox into the NYXUS frosted-
# glass surface stack so the toolbar / tab strip / sidebar bleed the
# wallpaper-blur through them. Pairs with:
#
#   · /etc/chromium-flags.conf            (Wayland surface + force-dark UI)
#   · /etc/chromium/policies/managed/...  (managed dark + theme color)
#   · /etc/chromium/initial_preferences   (per-profile theme.colors)
#   · ~/.mozilla/firefox/nyxus.default/chrome/userChrome.css  (Firefox UI)
#
# The compositor handles all translucency + Dual-Kawase blur — apps don't
# need to know they're being made glassy. This shard explicitly opts the
# browser classes IN to blur (in case a future user-level shard adds a
# global `noblur` exception) and bumps opacity slightly above the generic
# Electron tier so URL bars stay readable on a busy wallpaper.
#
# Numbers: active 0.94 / inactive 0.86 — slightly more opaque than the
# 0.92/0.82 used for generic Electron apps. Browsers display long-form
# content (article text, rendered web pages) where clarity beats vibe.
# If you want the toolbar even glassier, drop active to 0.88; everything
# below ~0.78 starts hurting page-content readability.

# ── Chromium family (chromium · brave · chrome · edge · vivaldi · arc) ──
windowrule = opacity 0.94 0.86, class:^([Cc]hromium|[Bb]rave-browser|[Gg]oogle-chrome|[Mm]icrosoft-edge|[Vv]ivaldi-stable|arc-browser)$
windowrule = noshadow,           class:^([Cc]hromium|[Bb]rave-browser|[Gg]oogle-chrome|[Mm]icrosoft-edge|[Vv]ivaldi-stable|arc-browser)$
windowrule = bordersize 1,       class:^([Cc]hromium|[Bb]rave-browser|[Gg]oogle-chrome|[Mm]icrosoft-edge|[Vv]ivaldi-stable|arc-browser)$
windowrule = rounding 6,         class:^([Cc]hromium|[Bb]rave-browser|[Gg]oogle-chrome|[Mm]icrosoft-edge|[Vv]ivaldi-stable|arc-browser)$

# ── Firefox family (firefox · librewolf · waterfox · zen-browser) ─────
# Wayland class is plain "firefox" on stock Arch builds; X11/XWayland
# fallbacks may report "Firefox" or "Navigator". Match all three.
windowrule = opacity 0.94 0.86, class:^([Ff]irefox|Navigator|librewolf|waterfox|zen-alpha|zen-browser)$
windowrule = noshadow,           class:^([Ff]irefox|Navigator|librewolf|waterfox|zen-alpha|zen-browser)$
windowrule = bordersize 1,       class:^([Ff]irefox|Navigator|librewolf|waterfox|zen-alpha|zen-browser)$
windowrule = rounding 6,         class:^([Ff]irefox|Navigator|librewolf|waterfox|zen-alpha|zen-browser)$

# Picture-in-Picture floating window — no opacity/blur, transient overlay
windowrule = opacity 1.0 1.0,    title:^(Picture-in-Picture)$
windowrule = float,              title:^(Picture-in-Picture)$
windowrule = pin,                title:^(Picture-in-Picture)$
windowrule = size 480 270,       title:^(Picture-in-Picture)$

# Private-browsing windows render the same as normal — Hyprland matches
# both because the class is identical; nothing extra needed here.
