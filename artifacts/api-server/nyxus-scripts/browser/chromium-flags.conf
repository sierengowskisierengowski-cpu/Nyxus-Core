# /etc/chromium-flags.conf — NYXUS Sprint K-D rev r16 (2026-05-14)
#
# System-wide Chromium command-line flags. Picked up automatically by the
# `chromium` Arch package via /usr/bin/chromium. Brave, Edge, Vivaldi, and
# Google Chrome do NOT read this file (they have their own per-binary
# *-flags.conf). The /etc/chromium/policies/ + initial_preferences pair
# below covers the rest of the Chromium-family browsers via managed policy
# instead.
#
# Goal: render Chromium as if it were a native NYXUS Wayland app —
#  · Wayland surface so Hyprland can apply Dual-Kawase blur + opacity
#    windowrules from nyxus-browser-blur.conf
#  · forced dark UI so toolbar/tab strip read cream-on-black
#  · GPU rasterization on so the wallpaper-blur doesn't burn CPU
#  · feature flags that enable system colors → match the NYXUS palette
#
# Anything we don't want exposed (e.g. crash reporter, default browser
# nag) is handled by /etc/chromium/policies/managed/nyxus-policy.json.

--ozone-platform-hint=auto
--enable-features=UseOzonePlatform,WaylandWindowDecorations,WebUIDarkMode,WebContentsForceDark,CSSColorSchemeUARendering
--force-dark-mode
--enable-wayland-ime
--enable-zero-copy
--ignore-gpu-blocklist
--enable-gpu-rasterization
--use-gl=angle
--use-angle=gl
--password-store=basic
