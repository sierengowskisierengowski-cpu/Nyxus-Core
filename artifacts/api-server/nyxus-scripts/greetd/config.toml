#  NYXUS — greetd configuration
#  © 2026 JOSEPH SIERENGOWSKI · NYX-J5W-2026-SIERENGOWSKI-LOCKED
#  rev 2026-07-14 — Wayland greeter chain (replaces SDDM; SDDM's X11 greeter
#  crashed/failed VT handoff on this hybrid Intel+NVIDIA GPU).
#
#  default_session runs /usr/local/bin/nyxus-greeter, a fallback chain:
#  regreet (themed) -> tuigreet (text) -> agreety (bare). See that script.
# ============================================================

[terminal]
# Run the greeter on VT 1 (where the boot messages already are — avoids the
# VT-switch handoff that left SDDM's greeter invisible on VT2).
vt = 1

[default_session]
command = "/usr/local/bin/nyxus-greeter"
user = "greeter"
