# ============================================================
#  NYXUS · SECURITY CONSOLES  (2026-07-27)
#
#  RedForge, CIPHER, GSL and the AI Defense Trainer.
#
#  FLOATING AND FREELY RESIZABLE - deliberately not tiled. Four of these do
#  not fit side by side at a usable size (see the min-size note below), and
#  the owner wants to drag and resize them to taste. This also keeps them in
#  step with nyxus-freeform.conf, which puts the whole build in FREEFORM.
#
#  They open cascaded rather than stacked dead-centre, so all four are
#  grabbable the moment they map.
#
#  MIN SIZE: the Tauri shells were rebuilt with minWidth 840 / minHeight 410
#  (they shipped at 1000x680, which made anything smaller impossible - Hyprland
#  cannot shrink a window below its own minimum). So they can now be pulled
#  down to roughly a quarter-screen if you want them side by side.
#
#  WORKSPACE: station 10, ARSENAL (owner's choice). Station 3 is GHOST's
#  security deck and was already taken - putting these there was my mistake.
# ============================================================

windowrule = workspace 10, match:class ^(redforge|cipher|gsl|nyxus-trainer)$
windowrule = float on, match:class ^(redforge|cipher|gsl|nyxus-trainer)$
windowrule = center off, match:class ^(redforge|cipher|gsl|nyxus-trainer)$
windowrule = persistent_size on, match:class ^(redforge|cipher|gsl|nyxus-trainer)$

# open at a comfortable working size; drag/resize freely from there
windowrule = size 1100 700, match:class ^(redforge|cipher|gsl|nyxus-trainer)$

# cascade so they never land exactly on top of one another
windowrule = move 90 80,   match:class ^(redforge)$
windowrule = move 250 150, match:class ^(cipher)$
windowrule = move 410 220, match:class ^(gsl)$
windowrule = move 570 290, match:class ^(nyxus-trainer)$
