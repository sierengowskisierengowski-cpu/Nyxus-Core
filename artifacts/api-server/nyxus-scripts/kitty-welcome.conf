# ── Font · tech display (Orbitron) — falls back if missing ───────────
font_family      Orbitron
bold_font        Orbitron
italic_font      Orbitron
bold_italic_font Orbitron
font_size        13.5
# Bigger brand feel without blowing past typical 1080p
modify_font      cell_height 115%
modify_font      cell_width 102%

# ── Window · void, no chrome ─────────────────────────────────────────
background_opacity        0.94
window_padding_width      28 36
hide_window_decorations   yes
confirm_os_window_close   0
remember_window_size      no
initial_window_width      980
initial_window_height     920
linux_display_server      wayland
wayland_titlebar_color    background
placement_strategy        center

# ── Cursor · neon block ──────────────────────────────────────────────
cursor                    #ff2dad
cursor_text_color         #05060a
cursor_shape              block
cursor_blink_interval     0.45

# ── Quiet ────────────────────────────────────────────────────────────
enable_audio_bell         no
visual_bell_duration      0.0
scrollback_lines          2000

# ── ALIEN NEON ───────────────────────────────────────────────────────
foreground                #eef2fa
background                #05060a
selection_foreground      #05060a
selection_background      #7d3dff

