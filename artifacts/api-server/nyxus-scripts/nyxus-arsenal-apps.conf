# ============================================================
#  NYXUS — Arsenal native apps (nyxus-app-shell) window rules
#  ~/.config/hypr/conf.d/nyxus-arsenal-apps.conf
#
#  The security tools (CIPHER, Forge, RedForge, GSL, AI Cyber Defense
#  Trainer, AXIOM) run as REAL native windows via `nyxus-app-shell <id>`
#  (Tauri). They all share the Wayland class "NYXUS App", so the
#  class-level rules below float them, size them roomy, and park them on
#  the CORE (6) workstation — leaving the alien wallpaper visible around
#  every window. Per-app `move` rules stagger them so opening several at
#  once cascades instead of stacking.
#
#  Syntax matches the rest of nyxus-hyprland-rules.conf: `windowrule =
#  PROP, match:KIND ^(REGEX)$` (the only form that parses clean on
#  Hyprland 0.54.x — do NOT switch to windowrulev2/comma-regex).
#  © 2026 JOSEPH A. SIERENGOWSKI · NYX-J5W-2026-SIERENGOWSKI-LOCKED
# ============================================================

# -- Shared: every nyxus-app-shell window → floating, roomy, on CORE (6) --
windowrule = float on,            match:class ^(NYXUS App|com\.nyxus\.appshell|nyxus-app-shell)$
windowrule = size 1180 760,       match:class ^(NYXUS App|com\.nyxus\.appshell|nyxus-app-shell)$
windowrule = workspace 6 silent,  match:class ^(NYXUS App|com\.nyxus\.appshell|nyxus-app-shell)$
windowrule = rounding 12,         match:class ^(NYXUS App|com\.nyxus\.appshell|nyxus-app-shell)$
windowrule = border_size 2,       match:class ^(NYXUS App|com\.nyxus\.appshell|nyxus-app-shell)$
# Slight transparency so the alien wallpaper glows through the edges/gaps.
windowrule = opacity 0.97 0.90,   match:class ^(NYXUS App|com\.nyxus\.appshell|nyxus-app-shell)$

# -- Per-app stagger (evaluated at map time on the window's title) so
#    multiple arsenal apps cascade across CORE instead of overlapping. --
windowrule = move 70 80,    match:title ^(CIPHER)$
windowrule = move 170 130,  match:title ^(Forge)$
windowrule = move 270 180,  match:title ^(RedForge)$
windowrule = move 370 230,  match:title ^(GSL)$
windowrule = move 120 260,  match:title ^(AI Cyber Defense Trainer)$
windowrule = move 470 150,  match:title ^(AXIOM)$
