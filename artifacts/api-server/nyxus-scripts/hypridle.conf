# ─────────────────────────────────────────────────────────────────────
# NYXUS · hypridle configuration
# Lives at: ~/.config/hypr/hypridle.conf
#
# Idle pipeline (rev 2026-07-24 · urban-alien saver + real re-login):
#    45s        → frost every window to glass (living wall reads through)
#   300s (5m)   → dim screen + launch the URBAN-ALIEN screensaver
#                 (nyxus_screensaver.py — the alien wallpaper hero, clock +
#                 NYXUS mark over the dimmed skyline). Any activity dismisses
#                 it (hypridle on-resume kills it + restores brightness).
#   600s (10m)  → LOCK the session (hyprlock, urban-alien background) and turn
#                 the panel off. Returning from here requires logging back in.
#   900s (15m)  → suspend the system.
#
# Locking: the screensaver is a VISUAL overlay only — it does NOT authenticate.
# The real lock is hyprlock (urban-alien lock hero, see hyprlock.conf), invoked
# via `loginctl lock-session` at the 10-minute mark, on Super+L, and before
# sleep. hyprlock renders inside the running Hyprland GPU context, so it is not
# affected by any greeter/GL issues. So the flow the owner asked for is:
#   idle → urban-alien screensaver → (stay idle) → lock → log back in.
#
# © 2026 JOSEPH A. SIERENGOWSKI · NYX-J5W-2026-SIERENGOWSKI-LOCKED
# ─────────────────────────────────────────────────────────────────────

general {
  # guard prevents stacking multiple hyprlock instances.
  # NYXUS cosmic sound theme: lock_cmd fires the lock chime for every lock
  # path (Super+L, wlogout lock, hypridle's 10-min lock, before-sleep — all
  # route through loginctl lock-session), and unlock_cmd fires the unlock
  # chime when logind unlocks the session. nyxus-sound fails silent if the
  # theme is muted (~/.config/nyxus/sound.state) or audio is unavailable.
  # (The lock BACKGROUND is pinned to the urban-alien hero in hyprlock.conf,
  # so no wall needs to be staged here.)
  lock_cmd         = nyxus-sound lock ; pidof hyprlock || hyprlock
  unlock_cmd       = nyxus-sound unlock
  before_sleep_cmd = loginctl lock-session
  after_sleep_cmd  = hyprctl dispatch dpms on
  ignore_dbus_inhibit = false
}

# 45 s — NYXUS IDLE GLASS: fade every window to frosted glass (blur stays
# on) so the living wallpaper reads straight through the panes. The first
# input snaps the shipped opacities back. Purely visual; costs nothing while
# idle. The screensaver + hyprlock are pinned opaque by a windowrule so this
# never makes the saver/lock see-through.
listener {
  timeout      = 45
  on-timeout   = ~/.config/hypr/scripts/nyxus-idle-glass.sh on
  on-resume    = ~/.config/hypr/scripts/nyxus-idle-glass.sh off
}

# 300 s (5 min) — dim + launch the URBAN-ALIEN screensaver.
# nyxus-screensaver runs nyxus_screensaver.py (the alien wallpaper hero). It
# is a standalone GTK4 app pinned to nyxus-urban-alien.png; on-resume restores
# brightness, lifts idle-glass, and tears the saver down so the user lands on a
# clean session. `eww close screensaver` is a no-op safety net for the legacy
# static starfield overlay.
listener {
  timeout      = 300
  on-timeout   = brightnessctl -s set 10% ; nyxus-screensaver &
  on-resume    = brightnessctl -r ; ~/.config/hypr/scripts/nyxus-idle-glass.sh off ; pkill -f nyxus_screensaver 2>/dev/null ; eww close screensaver 2>/dev/null || true
}

# 600 s (10 min) — LOCK + panel off. Tear the saver down, lock the session
# (hyprlock draws the urban-alien lock hero), then dpms off. Returning from
# here lands on hyprlock, so the user must log back in.
listener {
  timeout      = 600
  on-timeout   = pkill -f nyxus_screensaver 2>/dev/null ; loginctl lock-session ; hyprctl dispatch dpms off
  on-resume    = hyprctl dispatch dpms on
}

# 900 s (15 min) — suspend
listener {
  timeout      = 900
  on-timeout   = systemctl suspend
}
