# ─────────────────────────────────────────────────────────────────────
# NYXUS · hypridle configuration
# Lives at: ~/.config/hypr/hypridle.conf
#
# Idle pipeline (DARK MIRROR · enterprise-grade · Comet-Fire r2):
#   180s  → dim screen + open EWW screensaver overlay (clock + brand)
#   300s  → keep screensaver (visual only)
#   420s  → screen off (dpms)
#   600s  → suspend the system
#
# Locking (rev 2026-07-14): the EWW screensaver is a VISUAL overlay only —
# it does not authenticate. The real lock is hyprlock, invoked via
# `loginctl lock-session` (Super+L and before-sleep). hyprlock renders in
# the running Hyprland GPU context, so it is not affected by the SDDM
# hardware-GL greeter crash. The screensaver stays as pre-lock eye-candy.
#
# All on-resume actions restore brightness and tear the EWW overlay
# back down so the user lands on a clean session.
#
# © 2026 JOSEPH A. SIERENGOWSKI · NYX-J5W-2026-SIERENGOWSKI-LOCKED
# ─────────────────────────────────────────────────────────────────────

general {
  # guard prevents stacking multiple hyprlock instances.
  # NYXUS cosmic sound theme (rev 2026-07-14): lock_cmd fires the lock
  # chime for every lock path (Super+L, wlogout lock, before-sleep — all
  # route through loginctl lock-session), and unlock_cmd fires the unlock
  # chime when logind unlocks the session. nyxus-sound fails silent if the
  # theme is muted (~/.config/nyxus/sound.state) or audio is unavailable.
  lock_cmd         = nyxus-rotate-walls lock ; nyxus-sound lock ; pidof hyprlock || hyprlock
  unlock_cmd       = nyxus-sound unlock
  before_sleep_cmd = loginctl lock-session
  after_sleep_cmd  = hyprctl dispatch dpms on
  ignore_dbus_inhibit = false
}

# 45 s — NYXUS IDLE GLASS: fade every window to frosted glass (blur stays
# on) so the living wallpaper reads straight through the panes. The first
# input snaps the shipped opacities back. Purely visual; costs nothing while
# idle. The screensaver + hyprlock are pinned opaque by a windowrule so this
# never makes the saver/lock see-through.
listener {
  timeout      = 45
  on-timeout   = ~/.config/hypr/scripts/nyxus-idle-glass.sh on
  on-resume    = ~/.config/hypr/scripts/nyxus-idle-glass.sh off
}

# 180 s — dim + launch the alien-wallpaper screensaver (nyxus-screensaver).
# The saver is a standalone GTK4 app; it quits on any input and honours
# SIGTERM, so on-resume just pkills it. eww close screensaver is kept as a
# no-op safety net for the legacy static starfield overlay. on-resume also
# lifts idle-glass in case the saver launched over already-glassed windows.
listener {
  timeout      = 180
  on-timeout   = brightnessctl -s set 10% ; nyxus-screensaver & 
  on-resume    = brightnessctl -r ; ~/.config/hypr/scripts/nyxus-idle-glass.sh off ; pkill -f 'nyxus_(matrix_saver|screensaver)' 2>/dev/null ; eww close screensaver 2>/dev/null || true
}

# 300 s — reinforce screensaver (single-instance guard prevents dupes)
listener {
  timeout      = 300
  on-timeout   = nyxus-screensaver &
  on-resume    = brightnessctl -r ; ~/.config/hypr/scripts/nyxus-idle-glass.sh off ; pkill -f 'nyxus_(matrix_saver|screensaver)' 2>/dev/null ; eww close screensaver 2>/dev/null || true
}

# 420 s — panel off (Comet-Fire r2 · 2026-07-11).
listener {
  timeout      = 420
  on-timeout   = hyprctl dispatch dpms off
  on-resume    = hyprctl dispatch dpms on
}

# 600 s — suspend
listener {
  timeout      = 600
  on-timeout   = systemctl suspend
}
