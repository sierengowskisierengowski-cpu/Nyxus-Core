name: build-iso

# MANUAL-DISPATCH ONLY (by design).
#
# The authoritative NYXUS ISO — with the Kage-Ryu kernel as the default boot
# kernel — is baked by the owner on an Arch host that has the prebuilt
# linux-kage-ryu packages (see HANDOFF.md §6). That custom kernel is NOT in any
# Arch repo and is a multi-GB out-of-band compile, so build-iso.sh HARD-FAILS
# when NYX_WITH_KAGE_RYU=1 and the packages are absent. A GitHub-hosted runner
# never has them, so an on-`push` bake fast-failed at the kernel gate on every
# single push (perpetually red on main). This workflow is therefore triggered
# on demand only, and CI bakes a stock-kernel VALIDATION ISO
# (NYX_WITH_KAGE_RYU=0) to prove the profile assembles into a bootable image.
# Static profile validation still runs on every push/PR via the `ci` workflow
# (iso-builder/verify-profile.sh).
on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Also create a GitHub Release with the (stock-kernel) validation ISO attached?"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: bake iso
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve ISO date (YYYY.MM.DD)
        id: ver
        run: |
          v="$(date -u +%Y.%m.%d)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "iso_name=nyxus-${v}-x86_64.iso" >> "$GITHUB_OUTPUT"
          echo "artifact_name=nyxus-iso-${v}" >> "$GITHUB_OUTPUT"

      - name: Bake ISO inside privileged Arch container
        run: |
          set -euxo pipefail
          docker run --rm --privileged \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            -e NYX_ISO_DATE="${{ steps.ver.outputs.version }}" \
            -e NYX_WITH_KAGE_RYU=0 \
            archlinux:latest bash -euxc '
              pacman-key --init
              pacman-key --populate archlinux
              pacman -Sy --noconfirm archlinux-keyring
              pacman -Syu --noconfirm --needed archiso git base-devel grep coreutils grub edk2-shell mtools dosfstools
              cd iso-builder
              ./build-iso.sh
              ls -lh out/
            '

      - name: Verify ISO landed
        id: iso
        run: |
          set -euo pipefail
          shopt -s nullglob
          isos=(iso-builder/out/*.iso)
          if (( ${#isos[@]} == 0 )); then
            echo "::error::no ISO produced"
            exit 1
          fi
          iso="${isos[0]}"
          size=$(stat -c%s "$iso")
          echo "path=$iso" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$size" >> "$GITHUB_OUTPUT"
          echo "size_human=$(numfmt --to=iec --suffix=B "$size")" >> "$GITHUB_OUTPUT"
          (cd iso-builder/out && sha256sum *.iso > "${{ steps.ver.outputs.iso_name }}.sha256")
          (cd iso-builder/out && sha512sum *.iso > "${{ steps.ver.outputs.iso_name }}.sha512")
          ls -lh iso-builder/out/

      - name: Upload ISO as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.artifact_name }}
          path: |
            iso-builder/out/*.iso
            iso-builder/out/*.sha256
            iso-builder/out/*.sha512
          if-no-files-found: error
          retention-days: 14

      - name: Create / update GitHub Release with ISO attached
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iso-${{ steps.ver.outputs.version }}
          name: NYXUS validation ISO ${{ steps.ver.outputs.version }} (stock kernel)
          body: |
            Automated NYXUS **stock-kernel validation** ISO bake from commit ${{ github.sha }}.

            > This CI ISO is baked with `NYX_WITH_KAGE_RYU=0` (stock `linux` only).
            > The authoritative NYXUS ISO with the Kage-Ryu default kernel is baked
            > by the owner on an Arch host (see HANDOFF.md §6) — do not flash this
            > CI image expecting the custom kernel.

            - File: `${{ steps.ver.outputs.iso_name }}`
            - Size: ${{ steps.iso.outputs.size_human }}
            - SHA256 + SHA512 checksums attached.

            Flash with:
            ```
            sudo dd if=${{ steps.ver.outputs.iso_name }} of=/dev/sdX bs=4M status=progress oflag=sync
            ```
          files: |
            iso-builder/out/*.iso
            iso-builder/out/*.sha256
            iso-builder/out/*.sha512
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
