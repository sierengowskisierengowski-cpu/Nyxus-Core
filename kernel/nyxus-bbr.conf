# NYXUS — network tuning (deploy to /etc/sysctl.d/99-nyxus-bbr.conf)
# BBR congestion control + FQ qdisc: better throughput/latency for the
# honeypot/C2/remote-work networking this machine does. Pairs with the
# kage-ryu kernel's CONFIG_TCP_CONG_BBR + CONFIG_NET_SCH_FQ, but is also
# safe on the stock Arch kernel (both ship BBR + fq).
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
